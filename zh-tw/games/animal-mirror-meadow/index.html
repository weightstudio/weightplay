      </section>
    </main><section id="publicGuide" class="game-page-info game-page-info-static" data-wp-game-guide><h2 data-copy="guide">遊戲指南</h2><ol id="guideSteps"><li>點編號鏡子，切換／與＼。光線立即轉彎，沒有隱藏的角度密碼。</li><li>同時點亮所有編號燈塔就能過關。光可以穿過燈塔，但會被石牆擋住。</li><li>紫色分光鏡會同時讓光直行與反射。相同圓環的傳送門把光送到另一端，方向不變。</li><li>提示只指出一面可調整的鏡子，不會代玩。可以免費復原或重玩；過關後自動存檔並解鎖下一關。</li></ol><div class="game-info-section"><h3>常見問題</h3><dl><div><dt>進度會保存嗎？</dt><dd>會，只保存在這個瀏覽器中。</dd></div></dl></div></section>
