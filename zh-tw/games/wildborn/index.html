<body data-screen="main" data-game-id="wildborn" data-wp-game-id="wildborn" data-has-stage="false" data-wp-game-owned-guide data-wp-play-ui="1">
<div id="gameFrame" data-wp-frame-root>
  <div id="mainGroup">
    <main id="mainScreen">
      <header id="mainHeader">
        <a id="mainReturn" href="/zh-tw/index.html?preview=1" data-wp-return="main" aria-label="返回"><span aria-hidden="true">←</span></a>
        <h1 data-wp-frame-title data-wp-game-title data-runtime-localize="off">荒野輪迴</h1>
      </header>
      <div id="mainContent">
        <img id="poster" data-wp-frame-poster src="/games/wildborn/art/poster.webp" alt="荒野輪迴" width="1254" height="1254" fetchpriority="high">
        <div data-wp-frame-copy>
          <p data-wp-frame-summary data-copy="summary" data-runtime-localize="off">從渺小開始。在荒野覓食、躲藏，慢慢進化。死亡之後，重新投生。</p>
          <button id="startBtn" type="button" data-wp-main-start data-wp-frame-action="primary" data-copy="start" data-runtime-localize="off" disabled>開始一段生命</button>
          <p id="entryError" role="status" hidden></p>
        </div>
      </div>
    </main>
    <section id="gameGuide" class="game-page-info game-page-info-static" data-wp-game-guide aria-label="生存筆記">
      <div id="gameGuideTitle" class="game-info-hero" data-wp-content-slot="guide-title"><h2 data-official-title data-runtime-localize="off">荒野輪迴</h2><p data-copy="summary" data-runtime-localize="off">從渺小開始。在荒野覓食、躲藏，慢慢進化。死亡之後，重新投生。</p></div>
      <div id="gameGuideFacts" class="game-info-facts" data-wp-content-slot="guide-facts">
        <div class="game-info-fact"><strong>6</strong><span data-copy="origins" data-runtime-localize="off">隨機投生</span></div>
        <div class="game-info-fact"><strong data-copy="world" data-runtime-localize="off">生態世界</strong><span data-copy="noStages" data-runtime-localize="off">沒有關卡</span></div>
      </div>
      <div id="gameGuideSections" class="game-info-sections" data-wp-content-slot="guide-sections">
        <section class="game-info-section"><h2 data-copy="how" data-runtime-localize="off">如何活下來</h2><p data-copy="rules" data-runtime-localize="off">走近食物自動進食；在高草中慢下來就能躲藏。水會拖慢陸生動物。看見天敵蓄力，就準備閃開。</p><p data-copy="controls" data-runtime-localize="off">移動：WASD／方向鍵／拖曳。攻擊：空白鍵。衝刺：Shift。</p></section>
        <section class="game-info-section"><h2 data-copy="life" data-runtime-localize="off">一次生命</h2><p data-copy="progress" data-runtime-localize="off">覓食推進進化，棲地經歷決定適應能力。死亡會重置力量，只留下紀錄與選購外觀。這裡沒有關卡。</p><img class="guide-orla" src="/assets/weightplay-character-moon-cap-owl-block-v1.webp" alt="Moon Cap Orla" width="100" height="100" loading="lazy"></section>
      </div>
      <div id="gameGuideFaq" data-wp-content-slot="guide-faq"></div><div id="gameGuideRelated" data-wp-content-slot="guide-related"></div>
    </section>

  <section id="battleScreen" hidden data-wp-frame-play-fill data-wp-frame-logical-header="battle" data-wp-logical-battle-canvas data-wp-battle-canvas-root data-wp-canvas-max-width="920" data-wp-battle-min-width="390" data-wp-battle-min-height="720" data-wp-battle-landscape-width="760" data-wp-battle-landscape-height="334">

    <div id="playContent">
      <div id="hud" data-wp-frame-info><span><b id="biomeText"></b></span><span><b id="timeText"></b></span></div>
      <div id="world" tabindex="0" role="application" aria-label="在荒野中移動">
        <div id="creatureHud" class="creature-hud" aria-live="off">
          <div id="creatureName" class="creature-name"></div>
          <div class="vitality meter" role="progressbar" aria-label="生命" aria-valuemin="0" aria-valuemax="100"><i id="healthBar"></i></div>
          <div class="hunger meter" role="progressbar" aria-label="飽食" aria-valuemin="0" aria-valuemax="100"><i id="hungerBar"></i></div>
          <div class="growth meter" role="progressbar" aria-label="進化" aria-valuemin="0" aria-valuemax="100"><i id="growthBar"></i></div>
          <span id="coverStatus"></span>
        </div>
        <div id="worldNotice" class="world-notice" role="status" aria-live="polite"></div>
        <div id="firstHint" class="first-hint" hidden></div>
        <div id="actionControls" class="action-controls" data-wp-joystick-ignore>
          <button id="dashBtn" type="button" data-copy="dash" data-runtime-localize="off">衝刺</button>
          <button id="attackBtn" type="button" data-copy="attack" data-runtime-localize="off">攻擊</button>
          <div class="stamina meter" role="progressbar" aria-label="體力" aria-valuemin="0" aria-valuemax="100"><i id="staminaBar"></i></div>
        </div>
      </div>
    </div>
    <div id="overlay" class="overlay" hidden>
      <section id="dialog" class="life-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <h2 id="dialogTitle"></h2><div id="dialogBody"></div><div id="dialogActions"></div>
      </section>
    </div>
  </section>
</div>
