      <h2 id="guideTitle" data-word="guide">遊戲指南</h2>
      <article class="game-info-section"><h3 data-word="goal">目標</h3><p data-word="description">在工坊和砲塔之間切換電力，備好電芯，守住充電站。</p></article>
      <article class="game-info-section"><h3 data-word="how">玩法</h3><p data-word="howText">看清來襲路線，部署砲塔並在敵機接近時供電。空檔時把電送給工坊，補充電芯。</p></article>
      <article class="game-info-section"><h3 data-word="rules">操作與規則</h3><p data-word="rulesText">金線標出射程。通電砲塔每波首次開火消耗一顆電芯，之後會自動連射。升級線圈可破盾。</p></article>
      <article class="game-info-section"><h3 data-word="finish">結算與獎勵</h3><p data-word="finishText">撐過所有脈衝。充電站毫髮無傷可得三星。可免費重試，或在班次之間換上解鎖的模組。</p><button id="practiceBtn" type="button" data-word="practice" data-wp-frame-action="secondary">重看操作教學</button></article>
