 <section id="mainGuide" data-runtime-localize="off" class="game-page-info" data-wp-main-guide><h2 data-copy="title" data-runtime-localize="off">汪汪小院</h2><img class="guide-taro" src="/assets/weightplay-character-moss-shell-turtle-block-v1.webp" width="112" height="112" alt=""><p data-copy="guide" data-runtime-localize="off">點選庭院中的狗狗或下方名單。餵食、摸摸並清理便便；食物面板可購買三種等級的飼料。六種犬種都能選公母領養。健康、成年且無親緣的公母狗能迎接幼犬，懷孕需要45秒實際遊玩時間。餵食並照顧幼犬，陪牠長大。進度儲存在這台裝置，離開時需求不會下降。 庭院住滿時，可從「家庭」或「領養」進入「管理房間」。狗狗可以到小屋休息再接回，需求、成長與親緣都會保留。</p><div class="game-info-facts"></div><div class="game-info-sections"></div><div class="game-info-faq"></div><div class="game-info-related"></div></section>
