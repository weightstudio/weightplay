<body data-audience="general" data-runtime-localize="off" data-wp-game-id="animal-tangle-rescue" data-wp-game-version="v2" data-screen="main">

  <div id="app" hidden>
    <main id="mainScreen" class="screen main-screen" data-screen="main" data-wp-main-screen>
      <div class="main-canvas" data-wp-standard-main-screen data-wp-logical-main-canvas>
        <header class="main-header wp-main-shell-header">
          <a class="home-link wp-shell-return" data-wp-return="main" href="/" data-copy-aria-label="lobbyBack" aria-label="返回 WeightPlay"><span aria-hidden="true">←</span><img src="../../assets/weightplay-logo.png" alt="" draggable="false"></a>

          <button id="mainSettingsBtn" class="icon-btn wp-shell-settings-button" type="button" aria-expanded="false" aria-controls="settingsPanel" data-wp-settings data-copy-aria-label="settings" aria-label="设置"><span aria-hidden="true">⚙</span><span class="sr-only" data-copy="settings">设置</span></button>
        </header>
        <section class="hero-card">
          <img class="cover-art main-poster" src="assets/animal-tangle-rescue-cover.png" alt="" aria-hidden="true" width="1254" height="1254" fetchpriority="high">
          <div class="hero-copy">
            <p class="eyebrow" data-copy="kicker">苔壳塔罗的救援地图</p>
            <h1 data-copy="title">缠藤救援</h1>
            <p class="intro main-summary wp-standard-main-summary" data-copy="intro">交换两个藤蔓端点，让每条路径都连到相符的栖所。</p>
            <p id="mainProgress" class="progress main-progress" data-wp-main-progress role="status" aria-live="polite"></p>
            <div class="hero-actions">
              <button id="startBtn" class="primary-btn" type="button" data-wp-main-start data-copy="start">开始救援</button>
              <button id="mapBtn" class="secondary-btn" type="button" data-copy="map">救援地图</button>
            </div>
          </div>
        </section>
        <section id="settingsPanel" class="settings-panel wp-shell-settings-popover" role="dialog" hidden aria-labelledby="settingsHeading">
          <div class="settings-head"><h2 id="settingsHeading" data-copy="settings">设置</h2><button id="closeSettingsBtn" class="text-btn" type="button" data-copy="close">关闭</button></div>
          <label class="setting-row"><span data-copy="language">语言</span><select id="languageSelect" data-copy-aria-label="language" aria-label="语言"><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="pt-BR">Português</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="ru">Русский</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select></label>
          <button id="soundBtn" class="secondary-btn setting-sound" type="button" aria-pressed="true" data-sound-toggle></button>
        </section>
      </div>
    </main>

    <details id="guideScreen" class="guide-card game-page-info" data-wp-game-guide aria-labelledby="guideHeading">
      <summary id="guideHeading" data-copy="guideTitle">玩法说明</summary>
      <div class="guide-canvas" data-wp-logical-guide-canvas>
        <div class="guide-grid">
          <article><span class="step-dot">1</span><h3 data-copy="guideOneTitle">阅读栖所</h3><p data-copy="guideOne">下方一列会显示每个栖所需要的动物。</p></article>
          <article><span class="step-dot">2</span><h3 data-copy="guideTwoTitle">交换两个端点</h3><p data-copy="guideTwo">先点一个藤蔓端点，再点另一个，动物就会交换位置。</p></article>
          <article><span class="step-dot">3</span><h3 data-copy="guideThreeTitle">检查救援</h3><p data-copy="guideThree">正确路径会连线；错误尝试会保留且不会受惩罚。</p></article>
        </div>
        <button id="guideStartBtn" class="primary-btn" type="button" data-copy="start">开始救援</button>
      </div>
    </details>

    <section id="stageScreen" class="screen" data-screen="stage" hidden>
      <div class="stage-canvas" data-wp-standard-stage-screen data-wp-logical-stage-canvas data-wp-canvas-max-width="920">

        <nav class="stage-tabs" data-copy-aria-label="map" aria-label="救援地图"><span aria-hidden="true"></span><button type="button" aria-current="page" data-copy="map">救援地图</button><span aria-hidden="true"></span></nav>
      </div>
      <div class="stage-ad-reserve game-ad-reserve" data-wp-stage-physical-reserve aria-hidden="true"></div>
    </section>

    <section id="battleScreen" class="screen" data-screen="battle" hidden>
      <div class="battle-canvas" data-wp-standard-battle-screen data-wp-logical-battle-canvas data-wp-canvas-max-width="920">
        <header class="panel-head"><button id="battleBackBtn" class="back-btn back-button wp-shell-return" data-wp-return="battle" type="button" data-copy="map">救援地图</button><h2 id="battleHeading"></h2><button id="battleSoundBtn" class="icon-btn panel-utility utility-button" data-wp-battle-utility type="button" aria-pressed="true" data-copy-aria-label="sound" aria-label="音效">♫</button></header>
        <div class="mission-row"><div><p class="eyebrow" data-copy="boardKicker">救援棋盘</p><p id="roundHint" class="panel-intro"></p></div><span id="progressBadge" class="progress-badge"></span></div>
        <section class="tangle-board" aria-labelledby="boardTitle"><h3 id="boardTitle" class="sr-only" data-copy="boardTitle">藤蔓端点棋盘</h3><div class="board-labels"><span data-copy="endpoints">藤蔓端点</span><span data-copy="shelters">动物栖所</span></div><div id="boardDiagram" class="board-diagram"></div></section>
        <p id="battleStatus" class="feedback" role="status" aria-live="polite"></p>
        <p class="move-hint" data-copy="moveHint">选择两个端点来交换。没有计时器。</p>
        <div class="battle-actions"><button id="checkBtn" class="primary-btn" type="button" data-wp-primary-action data-copy="check">检查救援</button><button id="resetBtn" class="secondary-btn" type="button" data-copy="reset">重置棋盘</button><button id="leaveBtn" class="text-btn" type="button" data-copy="leave">离开棋盘</button></div>
      </div>
      <div class="battle-ad-reserve game-ad-reserve" data-wp-battle-physical-reserve aria-hidden="true"></div>
    </section>

    <section id="resultScreen" class="screen" data-screen="result" hidden>
      <div class="result-canvas" data-wp-logical-result-canvas data-wp-canvas-max-width="920">
        <header class="panel-head"><button id="resultMapBtn" class="back-btn" type="button" data-copy="map">救援地图</button><h2 data-copy="resultKicker">救援结果</h2><span class="panel-utility" aria-hidden="true">✦</span></header>
        <div class="result-card"><div class="result-character" aria-hidden="true"><img src="assets/animal-tangle-rescue-guide.png" alt="" width="1024" height="1536"></div><p class="eyebrow" data-copy="successKicker">路径已连线</p><h1 id="resultHeading"></h1><p id="resultText"></p><div id="resultStats" class="result-stats"></div><div class="result-actions"><button id="resultPrimaryBtn" class="primary-btn" type="button"></button><button id="resultHomeBtn" class="text-btn" type="button" data-copy="home">回到开始</button></div></div>
      </div>
    </section>
  </div>
