<article class="game-info-section"><h3>目标</h3><p data-wp-intro-faq-source>把梭子送进印座，再走到出口。</p></article>
<article class="game-info-section"><h3>玩法</h3><p>站在织机上改写门规，再沿通行路线前进。</p></article>
<article class="game-info-section"><h3>操作与规则</h3><p>点击相邻格或按方向键。门会检查你携带的梭子或当前相位。</p></article>
<article class="game-info-section"><h3>如何完成</h3><p>抵达亮起的出口即可完成，也可以撤销、重试或挑战更短的路线。</p></article>
<article class="game-info-section"><h3>FAQ</h3><details><summary>怎样改写门规？</summary><p>走到能控制该行的织机，再选门规。</p></details><details><summary>为什么门还关着？</summary><p>确认手上的梭子与当前相位是否符合条件。</p></details></article>
