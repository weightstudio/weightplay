      <article class="game-info-section"><h3 data-word="how">玩法</h3><p data-word="howText">看清来袭路线，部署炮塔并在敌机接近时供电。空档时给工坊补充电芯。</p></article>
      <article class="game-info-section"><h3 data-word="rules">操作与规则</h3><p data-word="rulesText">金线标出射程。通电炮塔每波首次开火消耗一颗电芯，之后会自动连射。升级线圈可破盾。</p></article>
      <article class="game-info-section"><h3 data-word="finish">结算与奖励</h3><p data-word="finishText">撑过所有脉冲。充电站毫发无伤可得三星。可免费重试，或在班次之间换上解锁的模块。</p><button id="practiceBtn" type="button" data-word="practice" data-wp-frame-action="secondary">重看操作教学</button></article>
