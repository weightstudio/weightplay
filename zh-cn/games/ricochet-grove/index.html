<article class="game-info-section"><h3>落珠解谜</h3><p data-wp-intro-faq-source>改拨弹钉、收集露水，让种籽依序弹进花圃。</p><p data-grove-rules>选发射槽，先看预测的落点。改拨一支钉要一滴水，再投放种籽。碰到未采的晶泉会回一滴水。金色风标偏移两格，蓝色潮铰在被撞后翻面。</p></article><details><summary>不用钻石也能通关吗？</summary><p>可以。通关就能解锁工具；钻石只用来买永久外观。进度保存在这个浏览器。</p></details><div class="game-info-section game-info-related-section" data-wp-guide-related-interface="9"><h3>相关游戏</h3><div class="game-info-related-grid"><a class="game-info-related-card" data-game-id="animal-orb-fortress" data-wp-related-id="animal-orb-fortress" href="/zh-cn/games/animal-orb-fortress/"><img loading="lazy" src="/assets/animal-orb-fortress-cover-block-v1.webp?wp-media=07958c61dd7d18a0" width="96" height="96" alt=""><span>星珠要塞</span></a><a class="game-info-related-card" data-game-id="breakout" data-wp-related-id="breakout" href="/zh-cn/games/breakout/"><img loading="lazy" src="/assets/interface7-redrawn/breakout.webp?wp-media=07958c61dd7d18a0" width="96" height="96" alt=""><span>打砖块</span></a></div></div>
<!-- grove-guide:end -->
