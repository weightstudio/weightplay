<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#100d21"><meta name="weightplay-activity-id" content="demon-assault"><meta name="weightplay-candidate-revision" content="daily-play-v1"><meta name="weightplay-activity-audience" content="general"><meta name="weightplay-campaign-scope" content="daily-local-v1"><meta name="weightplay-acceptance-scope" content="owner-authorized-public"><title>惡魔來襲 · 每日一場</title><link rel="stylesheet" href="/activities/demon-assault/demon-assault-daily.css?v=20261014-recovery-local-2"></head>
<body><main id="battle" aria-label="惡魔來襲"><div id="liveGame">
<header class="top-track"><button id="back" class="icon-button" aria-label="返回活動說明">←</button><div class="stage-heading"><span id="stageLabel">裂隙 01</span><span class="preview-tag" id="previewTag">每日一場</span></div><button id="help" class="icon-button" aria-label="玩法說明">?</button></header><div id="dailyStatusLine"><strong id="dailyState">今日可挑戰</strong><span id="dailyNext">台灣時間 00:00 重置</span></div>
<section class="progress-track" aria-label="階段進度"><div class="progress-copy"><span id="objective">有效傷害</span><b id="damageValue">0 / 20</b><span class="reward" id="rewardValue"><img class="diamond-image" src="/assets/wonder-prop-diamond-block-v1.png" alt=""> 不發放鑽石</span></div><div class="track"><div id="progressFill"></div></div></section>
<div id="arena" tabindex="0" role="application" aria-label="拖曳下方彈弓中的方塊，向後拉再鬆手發射。方向鍵調整，空白鍵拉弓再鬆開。"><div class="boss-label" id="bossLabel"><span id="bossName">焚界魔王</span><span id="hpValue">20 / 20 HP</span><div class="hp-track"><div id="hpFill"></div></div></div><canvas id="world" aria-hidden="true"></canvas><canvas id="effects" aria-hidden="true"></canvas><div id="hint" class="aim-hint">按住發光方塊，往後拉</div><div id="sceneCaption" aria-hidden="true"></div><div id="feedback" role="status" aria-live="polite"></div><div id="power"><span id="powerLabel">拉力</span><b id="powerValue">0%</b><small id="aimPrediction" aria-live="polite"></small><div><i id="powerFill"></i></div></div></div>
<nav id="cameraNav" aria-label="戰場鏡頭"><button id="cameraSling"><img data-battle-art="sling" alt=""><span>回彈弓</span></button><div class="camera-readout"><span id="cameraStatus" role="status" aria-live="polite">左右拖曳查看</span><div class="camera-map" aria-hidden="true"><i id="cameraWindow"></i></div></div><button id="cameraBoss"><img data-battle-art="boss" alt=""><span>看惡魔</span></button></nav><footer class="control-track"><div class="ammo"><small id="ammoLabel">局內彈藥</small><strong><span id="ammoValue">36</span><span class="muted" id="ammoCap"> / 36</span></strong></div><div id="multipliers" role="group" aria-label="單顆傷害與彈藥成本"><button data-power="1" aria-pressed="false"><b>×1</b><small>1</small></button><button data-power="5" aria-pressed="true"><b>×5</b><small>5</small></button><button data-power="10" aria-pressed="false"><b>×10</b><small>10</small></button></div><button id="cancel" class="icon-button" aria-label="取消拉弓" disabled>×</button><p id="costHint">單顆傷害 ×5 · 消耗 5 點彈藥</p></footer><section id="aimDeck"><div class="pad-copy"><small id="padTitle">在此拉弓</small><p id="padHint">向左下拉，再鬆手</p></div><div id="aimPad" role="application" aria-label="放大拉弓區"><img data-battle-art="sling" alt="" class="pad-sling"><span id="padBlock" aria-hidden="true"></span><span class="pad-arrow" aria-hidden="true">←</span></div></section></div>
<div id="loading" class="overlay"><div class="panel"><div class="sigil"><img src="/assets/wonder-prop-diamond-block-v1.png" alt="" width="48" height="48"></div><h1>惡魔來襲</h1><p id="loadText">正在開啟裂隙…</p><p id="loadDetails" aria-live="polite"></p><button id="loadRetry" hidden>重新載入</button><button id="loadBack" class="secondary" hidden>返回活動說明</button></div></div>
<dialog id="modal" aria-labelledby="modalTitle"><div class="panel"><span class="eyebrow" id="modalKicker">DAILY RUN</span><h1 id="modalTitle">拉弓，擊碎裂隙</h1><p id="modalCopy"></p><div id="modalStats"></div><button id="primary" class="primary">開始試玩</button><button id="secondary" class="secondary" hidden>返回</button></div></dialog></main><script type="module" src="/activities/demon-assault/demon-assault-play.mjs?v=20261014-recovery-local-2"></script></body></html>
