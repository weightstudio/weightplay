<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#081424"><meta name="weightplay-activity-id" content="meteor-barrage"><meta name="weightplay-candidate-revision" content="meteor-barrage-3"><meta name="weightplay-activity-audience" content="general"><meta name="weightplay-acceptance-scope" content="owner-authorized-public"><title>星隕防線 · WeightPlay</title><link rel="stylesheet" href="./style.css?v=3"></head>
<body><main id="app" data-runtime-localize="off">
