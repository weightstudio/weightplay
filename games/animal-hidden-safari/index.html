    <script type="application/ld+json">
{
              "@context": "https://schema.org",
              "@type": "VideoGame",
              "name": "Animal Hidden Safari",
              "alternateName": "\u52d5\u7269\u63a2\u96aa\u627e\u627e\u770b",
              "url": "https://weightplay.com/games/animal-hidden-safari/",
              "image": "https://weightplay.com/assets/animal-hidden-safari-cover.png",
              "description": "Find partly hidden animals and safari objects across playful habitat scenes.",

              },

              ],

  <body data-tutorial-auto-show="false">
    <main class="safari-game" data-play-viewport data-no-mobile-immersive="true">
      <header class="topbar">
        <a class="home-link" data-wp-return="main" href="/" aria-label="Back to lobby"><span aria-hidden="true">&larr;</span><img src="../../assets/weightplay-logo.png" alt="" draggable="false" /></a>
        <div class="title-block">
          <p>WeightPlay</p>
          <h1 data-ui="gameTitle">Animal Hidden Safari</h1>
        </div>
        <label class="language-picker">
          <span data-ui="language">Language</span>
          <select id="localeSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="zh-Hant">&#32321;&#39636;&#20013;&#25991;</option>
          </select>
        </label>
      </header>

      <section id="mainPanel" class="menu-panel main-panel">
        <img class="cover" src="../../assets/animal-hidden-safari-cover.webp" data-fallback-src="../../assets/animal-hidden-safari-cover.png" alt="" />
        <div class="menu-copy">
          <strong data-ui="gameTitle">Animal Hidden Safari</strong>
          <span data-ui="menuHint">Find animals blended into each natural habitat.</span>
        </div>
        <button id="startGameBtn" class="stage-entry-btn" type="button" data-ui="chooseStage">Choose Habitat</button>
      </section>

      <section id="menuPanel" class="menu-panel stage-panel wp-stage-art-shell hidden" data-wp-stage-art="../../assets/animal-hidden-safari-cover.webp" style="--wp-stage-art: url('../../assets/animal-hidden-safari-cover.webp')">
        <div class="stage-head"><button id="stageBackMainBtn" data-wp-return="stage" type="button" aria-label="Back">&larr;</button><strong data-ui="chooseStage">Choose Habitat</strong></div>
        <div id="stageGrid" class="stage-grid" aria-label="Stage list"></div>
        <div class="stage-ad-reserve" aria-hidden="true"></div>
      </section>

      <section id="playPanel" class="play-panel hidden">
        <div class="play-head">
          <button id="backToStagesBtn" class="play-return" data-wp-return="battle" type="button" aria-label="Back to habitats">&larr;</button>
          <div class="progress-card">
            <span id="stageText">Stage 1</span>
            <div><i id="progressFill"></i></div>
          </div>
          <button id="hintBtn" class="hint-btn" type="button"><span data-ui="hint">Hint</span> <b id="hintCount">2</b></button>
        </div>

        <div id="scene" class="scene" aria-label="Hidden animal scene">
          <div id="targetsLayer" class="targets-layer"></div>
          <div id="floatLayer" class="float-layer"></div>
        </div>

          <div class="target-panel">
          <div>
            <strong data-ui="findList">Find These</strong>
            <span class="target-status"><b id="remainingText"></b><span id="timerText">0:00</span></span>
          </div>
          <div id="targetList" class="target-list"></div>
          </div>
        </section>

      <div id="resultPanel" class="result-panel hidden">
        <div class="result-card">
          <img class="result-celebration" src="../../assets/animal-hidden-safari-result-celebration.png" alt="" draggable="false" />
          <strong id="resultTitle">Great find!</strong>
          <div id="starText" class="stars">&#9734;&#9734;&#9734;</div>
          <span id="resultText"></span>
          <div class="skill-report">
            <b data-ui="skillReport">Skill Report</b>
            <p id="skillText"></p>
          </div>
          <button id="nextStageBtn" type="button" data-ui="nextStage">Next Habitat</button>
          <button id="retryBtn" type="button" data-ui="retry">Try Again</button>
          <button id="resultStagesBtn" type="button" data-ui="stages">Habitats</button>
          <a href="/" data-ui="lobby">Lobby</a>
        </div>
      </div>

      <div id="loadingPanel" class="loading-panel">
        <div class="loading-card">
          <strong data-ui="loading">Loading</strong>
          <span id="loadingText">0%</span>
          <div><i id="loadingFill"></i></div>
        </div>
      </div>
    </main>
    <div class="ad-reserve" aria-hidden="true"></div>

    <script src="../../src/site-config.js?v=20260710-safari-mobile-shell1"></script>
    <script src="../../src/version.js?v=20260701-version2"></script>
    <script src="../../src/analytics.js?v=20260701-analytics2"></script>
    <script>
      window.WonderAnalytics?.track("game_view", { game_id: "animal-hidden-safari" });
    </script>
    <script src="../../src/sound.js?v=20260701-labels1"></script>
    <script src="../../src/edge-guard.js?v=20260710-mobile-play-shell2"></script>
    <script src="../../src/i18n.js?v=20260703-i18n-clean1"></script>
    <script src="../../src/tutorial.js?v=20260702-tutorial-locale1"></script>
    <script src="game.js?v=20260712-expanded-canvas1"></script>
    <script>
      (() => {
        const loadGameInfo = () => {
          if (document.querySelector("script[data-safari-game-info]")) return;
          const script = document.createElement("script");
          script.src = "../../src/game-page-info.js?v=20260706-guide-age-layers1";
          script.dataset.safariGameInfo = "idle";
          script.async = true;
          document.body.appendChild(script);
        };
        const schedule = () => {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadGameInfo, { timeout: 1600 });
          } else {
            window.setTimeout(loadGameInfo, 350);
          }
        };
        if (document.readyState === "complete") schedule();
        else window.addEventListener("load", schedule, { once: true });
      })();
    </script>
  </body>
</html>
