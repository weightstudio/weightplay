<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#183d48" />
  <title>Story Stitch | WeightPlay</title>
  <link rel="stylesheet" href="style.css?v=20260830-story-stitch-v2" />
</head>
<body data-audience="general" data-wp-game-id="animal-story-stitch" data-wp-game-version="v2">
  <div id="loading" class="screen loading-screen"><div class="loader-mark">✦</div><p data-i18n="loading">Warming the story loom…</p></div>
  <main id="app" hidden>
    <header class="topbar"><button id="backBtn" class="icon-btn" type="button" data-action="back" aria-label="Back">←</button><strong data-i18n="title">Story Stitch</strong><button id="settingsBtn" class="icon-btn" type="button" data-action="settings" aria-label="Settings">⚙</button></header>
    <section id="mainScreen" class="screen panel" data-screen="main">
      <div class="cover-wrap"><img src="assets/animal-story-stitch-cover.svg" alt="" width="1200" height="900" /><span class="cover-badge" data-i18n="kicker">A gentle story puzzle</span></div>
      <p class="eyebrow" data-i18n="world">Meadow story loom</p><h1 data-i18n="title">Story Stitch</h1><p class="intro" data-i18n="intro">Put three picture clues in the order that makes the kindest little story.</p>
      <div class="main-actions"><button id="startBtn" class="primary" type="button" data-action="start" data-i18n="start">Start a story</button><button id="mapBtn" class="secondary" type="button" data-action="map" data-i18n="choose">Choose a tale</button></div>
      <p id="best" class="best" data-i18n="best">Best: —</p>
    </section>
    <section id="stageScreen" class="screen panel" data-screen="stage" hidden><p class="eyebrow" data-i18n="chapter">Story shelf</p><h2 data-i18n="choose">Choose a tale</h2><div id="stageList" class="stage-list"></div></section>
    <section id="battleScreen" class="screen panel" data-screen="battle" hidden><div class="battle-head"><div><p class="eyebrow" data-i18n="round">Tale</p><h2 id="battleTitle">Seed to shade</h2></div><span id="progressPill" class="pill">1 / 3</span></div><p id="prompt" class="prompt"></p><div id="storyRail" class="story-rail" role="list" aria-label="Story cards"></div><div class="reorder"><button id="upBtn" class="secondary" type="button" data-action="up" data-i18n="up">Move up</button><button id="downBtn" class="secondary" type="button" data-action="down" data-i18n="down">Move down</button></div><p id="selection" class="selection" aria-live="polite"></p><div class="battle-actions"><button id="checkBtn" class="primary" type="button" data-action="check" data-i18n="check">Stitch this order</button><button id="clearBtn" class="secondary" type="button" data-action="reset" data-i18n="reset">Reset order</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section>
    <section id="resultScreen" class="screen panel" data-screen="result" hidden><div class="result-icon">✦</div><p class="eyebrow" data-i18n="finished">Tale finished</p><h2 id="resultTitle" data-i18n="resultTitle">A lovely stitch!</h2><p id="resultText" class="intro"></p><div class="main-actions"><button id="nextBtn" class="primary" type="button" data-action="next" data-i18n="next">Next tale</button><button id="resultMapBtn" class="secondary" type="button" data-action="map" data-i18n="choose">Choose a tale</button></div></section>
    <section id="settingsPanel" class="modal" hidden><div class="modal-card"><button id="closeSettings" class="close-btn" type="button" data-action="closeSettings" data-i18n="close" aria-label="Close">×</button><h2 data-i18n="settings">Settings</h2><label class="setting-row"><span data-i18n="sound">Sound</span><button id="soundBtn" class="toggle" type="button" data-action="sound" aria-pressed="true">On</button></label><label class="setting-row"><span data-i18n="language">Language</span><select id="localeSelect" aria-label="Language"><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="pt-BR">Português</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="ru">Русский</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select></label></div></section>
  </main>
  <script src="locales.js?v=20260830-story-stitch-v2"></script><script src="game.js?v=20260830-story-stitch-v2"></script>
</body>
</html>
