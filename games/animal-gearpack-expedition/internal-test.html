<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#102825" />
  <title>Animal Gearpack Expedition - Internal Trial</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-screen="main">
  <main id="mainScreen" class="screen main-screen">
    <header class="main-topbar">
      <a class="home-link" href="/" aria-label="Back to WeightPlay"><span aria-hidden="true">&larr;</span><img src="../../assets/weightplay-logo.png" alt="" /></a>
      <strong data-i18n="title">Animal Gearpack Expedition</strong>
      <select id="localeSelect" aria-label="Language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select>
    </header>
    <img class="main-poster" src="../../assets/animal-gearpack-expedition-cover.webp" alt="Animal Gearpack Expedition poster" />
    <section class="main-copy">
      <p class="eyebrow" data-i18n="internal">Internal Trial</p>
      <h1 data-i18n="title">Animal Gearpack Expedition</h1>
      <p data-i18n="pitch">Pack equipment, build adjacency combos, and guide Rux through the Gearwood route.</p>
      <div class="progress-strip"><span id="workshopSummary"></span><span id="discoverySummary"></span></div>
      <button id="startBtn" class="primary" type="button" data-i18n="start">Start Expedition</button>
    </section>
  </main>

  <section id="stageScreen" class="screen stage-screen" hidden>
    <div class="stage-canvas">
      <header class="stage-header"><button id="stageBackBtn" class="icon-button" type="button" aria-label="Back">&larr;</button><strong data-i18n="chooseRegion">Choose Region</strong><span id="stageGold"></span></header>
      <section class="loadout-preview"><img src="../../assets/animal-gearpack-expedition-rux.webp" alt="Gear Horn Rux" /><div><strong data-i18n="packmaster">Packmaster Rux</strong><span id="loadoutText"></span></div></section>
      <div id="regionRail" class="region-rail" aria-label="Regions">
        <button class="region-card is-selected" data-region="0" type="button"><img src="../../assets/animal-gearpack-expedition-forest-bg.webp" alt="Gearwood trail" /><strong data-i18n="region1">Gearwood Trail</strong><span data-i18n="region1Meta">5 rooms · Root Guardian</span></button>
        <button class="region-card" data-region="1" type="button" disabled><span class="locked">🔒</span><strong data-i18n="region2">Moonlit Quarry</strong><span data-i18n="locked">Locked</span></button>
        <button class="region-card" data-region="2" type="button" disabled><span class="locked">🔒</span><strong data-i18n="region3">Clockwork Hollow</strong><span data-i18n="locked">Locked</span></button>
      </div>
    </div>
    <div class="stage-ad-reserve" aria-hidden="true"></div>
  </section>

  <section id="battleScreen" class="screen battle-shell" hidden>
    <div class="battle-canvas">
      <header class="battle-header"><button id="battleBackBtn" class="icon-button" type="button" aria-label="Back to regions">&larr;</button><div class="primary-progress"><span id="roomLabel"></span><strong id="armorLabel"></strong></div><button id="pauseBtn" class="icon-button" type="button" aria-label="Menu">&#9881;</button></header>
      <div class="objective-row"><span id="objectiveText"></span><span id="currencyText"></span></div>
      <section class="encounter-scene">
        <img id="ruxActor" class="actor rux" src="../../assets/animal-gearpack-expedition-rux.webp" alt="Gear Horn Rux" />
        <div class="enemy-wrap"><div id="enemyHpBar" class="hp-bar"><span></span></div><img id="enemyActor" class="actor enemy" alt="Enemy" /></div>
        <div id="combatFx" class="combat-fx"></div>
      </section>
      <section class="pack-panel">
        <div class="pack-heading"><strong data-i18n="backpack">Gearpack 5 x 7</strong><span id="statsText"></span></div>
        <div id="packGrid" class="pack-grid" aria-label="Backpack grid"></div>
        <div id="itemTray" class="item-tray" aria-label="Items"></div>
      </section>
      <div id="feedbackRow" class="feedback-row"></div>
      <div class="battle-actions"><button id="rotateBtn" type="button"><img src="../../assets/animal-gearpack-expedition-icons/rotate.webp" alt="" /><span data-i18n="rotate">Rotate</span></button><button id="sellBtn" type="button"><img src="../../assets/animal-gearpack-expedition-icons/sell.webp" alt="" /><span data-i18n="sell">Sell</span></button><button id="fightBtn" class="primary" type="button" data-i18n="fight">Start Encounter</button></div>
    </div>
    <div class="battle-ad-reserve" aria-hidden="true"></div>
  </section>

  <div id="modal" class="modal" hidden><div class="modal-card"><img id="modalArt" alt="" /><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalChoices" class="modal-choices"></div></div></div>
  <script src="game.js"></script>
</body>
</html>
