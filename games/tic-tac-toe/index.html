<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="weightplay-audience" content="general"><title>Tic-Tac-Toe | WeightPlay</title><link rel="stylesheet" href="../../src/popular-games-batch.css?v=20260820-ttt-natural-outcomes-v8">
<style>
html.popular-tic-tac-toe-active,
html.popular-tic-tac-toe-active body {
  overflow: hidden;
  overscroll-behavior: none;
}
html.popular-tic-tac-toe-active body {
  height: 100dvh;
  min-height: 0;
  touch-action: none;
}
html.popular-tic-tac-toe-active .popular-arcade {
  height: 100dvh;
  min-height: 0;
  padding: 12px 14px 16px;
  gap: 0;
}
html.popular-tic-tac-toe-active .arcade-header,
html.popular-tic-tac-toe-active .arcade-footer { display: none; }
html.popular-tic-tac-toe-active #battleScreen,
html.popular-tic-tac-toe-active #resultScreen {
  min-height: 0;
  height: 100%;
}
html.popular-tic-tac-toe-active #battleScreen .battle-panel,
html.popular-tic-tac-toe-active #resultScreen .arcade-panel {
  min-height: 0;
  height: 100%;
}

@media (orientation: landscape) and (max-height: 430px) {
  body[data-game-id="tic-tac-toe"][data-screen="battle"],
  body[data-game-id="tic-tac-toe"][data-screen="result"] { overflow: hidden; }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .popular-arcade,
  body[data-game-id="tic-tac-toe"][data-screen="result"] .popular-arcade {
    height: 100dvh;
    min-height: 0;
    padding: 6px;
    gap: 0;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .arcade-header,
  body[data-game-id="tic-tac-toe"][data-screen="result"] .arcade-header {
    display: block;
    position: fixed;
    top: 6px;
    left: 6px;
    z-index: 10;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .arcade-header > div,
  body[data-game-id="tic-tac-toe"][data-screen="result"] .arcade-header > div { display: none; }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .locale-picker,
  body[data-game-id="tic-tac-toe"][data-screen="result"] .locale-picker {
    display: block;
    width: 74px;
    min-width: 0;
    font-size: 0;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .locale-picker span,
  body[data-game-id="tic-tac-toe"][data-screen="result"] .locale-picker span {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .locale-picker select,
  body[data-game-id="tic-tac-toe"][data-screen="result"] .locale-picker select {
    width: 74px;
    height: 46px;
    padding: 4px 3px;
    font-size: .7rem;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .arcade-footer,
  body[data-game-id="tic-tac-toe"][data-screen="result"] .arcade-footer { display: none; }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] #battleScreen,
  body[data-game-id="tic-tac-toe"][data-screen="result"] #resultScreen {
    min-height: 0;
    height: 100%;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .battle-panel {
    height: 100%;
    min-height: 0;
    padding: 7px;
    gap: 6px 12px;
    align-content: stretch;
    grid-template-columns: minmax(320px, 1fr) minmax(280px, .85fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .board-wrap {
    grid-column: 1;
    grid-row: 1 / 4;
    min-height: 0;
    padding: 5px;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .board {
    height: 100%;
    min-height: 0;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .tic-board {
    width: min(100%, 350px);
    height: 100%;
    max-height: 100%;
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 4px;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .tic-cell {
    min-height: 0;
    aspect-ratio: auto;
    font-size: 3rem;
  }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .battle-top { grid-column: 2; grid-row: 1; }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] .game-message { grid-column: 2; grid-row: 2; align-self: start; }
  body[data-game-id="tic-tac-toe"][data-screen="battle"] #controls { grid-column: 2; grid-row: 3; }
  body[data-game-id="tic-tac-toe"][data-screen="result"] #resultScreen .arcade-panel {
    min-height: 0;
    height: 100%;
    padding: 16px;
    gap: 10px;
  }
}
</style></head>
<body><main id="popularArcade" class="popular-arcade"><header class="arcade-header"><div><div id="eyebrow" class="eyebrow"></div><h1 id="gameTitle"></h1><p id="gameTagline" class="tagline"></p></div><label class="locale-picker"><span id="languageLabel">Language</span><select id="localeSelect"></select></label></header><section id="mainScreen" class="screen"><div class="arcade-panel main-panel"><div class="main-copy"><p id="objective" class="objective"></p><p>Use visible controls to play a complete short round, then review the Result.</p><button id="startBtn" class="primary">Start game</button></div><div class="preview-art" aria-hidden="true">✕◯</div></div></section><section id="battleScreen" class="screen" hidden><div class="arcade-panel battle-panel"><div class="battle-top"><span id="roundLabel" class="round-label"></span><div class="control-row"><button id="hintBtn" class="secondary"></button><button id="restartBtn" class="secondary"></button></div></div><div class="board-wrap"><div id="board" class="board"></div></div><p id="gameMessage" class="game-message" aria-live="polite"></p><div id="controls"></div></div></section><section id="resultScreen" class="screen" hidden><div class="arcade-panel"><h2 id="resultTitle"></h2><p id="resultCopy" class="tagline"></p><div id="resultStats" class="stats"></div><div class="result-actions"><button id="retryBtn" class="primary"></button><button id="homeBtn" class="secondary"></button></div></div></section><footer class="arcade-footer" id="footerText"></footer></main><script src="../../src/site-config.js?v=20260820-ttt-natural-outcomes-v8"></script><script src="../../src/analytics.js?v=20260820-ttt-natural-outcomes-v8"></script><script src="../../src/popular-games-batch.js?v=20260820-ttt-natural-outcomes-v8"></script><script src="analytics-ownership.js?v=20260820-ttt-natural-outcomes-v8"></script><script src="game.js?v=20260820-ttt-natural-outcomes-v8"></script></body>
</html>
