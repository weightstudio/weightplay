<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Layer Grove</title>
  <desc id="desc">Three translucent habitat layers frame a friendly deer in a moonlit grove.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b35"/><stop offset="1" stop-color="#547765"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2f0bd" stop-opacity=".3"/><stop offset="1" stop-color="#8ac6a0" stop-opacity=".1"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="900" height="700" rx="42" fill="url(#sky)"/>
  <circle cx="700" cy="125" r="70" fill="#f8e4a5" opacity=".9"/>
  <circle cx="700" cy="125" r="105" fill="#f8e4a5" opacity=".16" filter="url(#glow)"/>
  <path d="M0 535 Q140 410 270 525 T530 500 T900 510 V700 H0Z" fill="#172d32"/>
  <path d="M0 590 Q180 490 360 575 T680 560 T900 575 V700 H0Z" fill="#25463f"/>
