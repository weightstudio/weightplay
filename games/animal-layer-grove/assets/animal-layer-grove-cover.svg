  </g>
  <g fill="#f8e4a5" font-family="system-ui,sans-serif" font-weight="800"><text x="58" y="90" font-size="30">WEIGHTPLAY ORIGINAL</text><text x="58" y="642" font-size="48">LAYER GROVE</text></g>
  <text x="60" y="680" fill="#d7ecd0" font-family="system-ui,sans-serif" font-size="22">A calm habitat depth puzzle</text>
</svg>
