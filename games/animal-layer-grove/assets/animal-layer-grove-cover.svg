    <path d="M90 160 L310 85 L410 185 L325 520 L100 465Z"/>
    <path d="M310 85 L610 120 L680 485 L325 520 L410 185Z"/>
    <path d="M610 120 L810 245 L760 535 L680 485Z"/>
  </g>
  <g fill="none" stroke="#dff0c5" stroke-width="8" stroke-linecap="round" opacity=".7"><path d="M145 442 Q185 330 230 265 T320 150"/><path d="M520 490 Q560 360 640 280"/><path d="M722 440 Q690 330 710 235"/></g>
  <g transform="translate(395 310)">
