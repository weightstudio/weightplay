    <circle cx="65" cy="55" r="88" fill="#c88a63"/>
    <path d="M4 8 L-55 -44 L-25 52 M126 8 L184 -44 L155 52" fill="#b97b58" stroke="#e8ba85" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="34" cy="55" r="9" fill="#172d32"/><circle cx="96" cy="55" r="9" fill="#172d32"/>
    <path d="M47 92 Q65 108 83 92" fill="none" stroke="#172d32" stroke-width="7" stroke-linecap="round"/>
