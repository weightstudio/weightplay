<!doctype html>
<html lang="zh-Hant" data-wp-official-name>
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow,noarchive"><meta name="weightplay-audience" content="general"><meta name="weightplay-game-id" content="puppy-haven"><meta name="weightplay-game-version" content="v1"><meta name="weightplay-interface-version" content="9">
 <script src="/src/weightplay-audio.js"></script>
 <title>汪汪小院 · Puppy Haven | WeightPlay</title>
 <script>if(new URLSearchParams(location.search).get('preview')!=='1')document.querySelector('meta[name="weightplay-interface-version"]').remove();</script>
 <link rel="stylesheet" href="/src/game-screen-frame.css"><link rel="stylesheet" href="/src/interface9-shared-screens.css"><link rel="stylesheet" href="/src/game-play-ui.css"><link rel="stylesheet" href="/src/game-page-info.css"><link rel="stylesheet" href="style.css">
</head>
<body data-screen="main" data-game-id="puppy-haven" data-wp-combined-sound="true">
 <section id="comingSoon" hidden><img src="assets/cover-block-v1.png" alt=""><h1>汪汪小院 · Puppy Haven</h1><p>敬請期待 · Coming Soon</p><a href="/">← WeightPlay</a></section>
 <div id="gameFrame" data-wp-frame-root>
  <main id="mainScreen"><header><a href="/?preview=1" data-wp-return="main">← W</a><strong data-wp-frame-title data-copy="title">汪汪小院</strong></header>
   <section class="main-hero"><img data-wp-frame-poster src="assets/cover-block-v1.png" width="1254" height="1254" alt="方塊柴犬、柯基、哈士奇與小狗在溫暖的庭院相聚">
    <div data-wp-frame-copy><p data-wp-frame-summary data-copy="summary"></p><p data-wp-frame-progress data-copy="preview"></p><button id="startBtn" data-wp-frame-start data-copy="start"></button></div>
   </section>
  </main>
  <section id="stageScreen" hidden><header><button id="stageBack" data-wp-return="stage">←</button><strong data-wp-frame-title hidden></strong></header><div id="stageWorkspace"><div id="stageRail"></div></div><nav data-wp-frame-nav><button id="missionTab" data-copy="missions"></button><button id="yardBtn" data-copy="freeYard"></button></nav></section>
  <section id="battleScreen" hidden><header><button id="battleBack" data-wp-return="battle">←</button><strong data-wp-frame-title hidden></strong></header>
   <div id="battleLive">
    <div id="objective" class="objective" aria-live="polite"></div>
    <div id="yard" class="yard"><div id="worldFallback" hidden><p data-copy="webgl"></p><button id="reloadBtn" data-copy="reload"></button></div><div id="worldCue" aria-live="polite"></div></div>
    <div id="dogRail" class="dog-rail" aria-label="Dogs"></div>
    <section id="carePanel" class="care-panel"><div class="dog-identity"><strong id="dogName"></strong><span id="dogAge"></span><span id="dogFamily"></span></div>
     <div class="needs"><label><span data-copy="hunger"></span><meter id="hunger" min="0" max="100"></meter><output id="hungerValue"></output></label><label><span data-copy="happy"></span><meter id="happy" min="0" max="100"></meter><output id="happyValue"></output></label><label><span data-copy="cleanliness"></span><meter id="clean" min="0" max="100"></meter><output id="cleanValue"></output></label></div>
     <div class="care-buttons"><button id="feedBtn" data-copy="feed"></button><button id="petBtn" data-copy="pet"></button><button id="cleanBtn" data-copy="clean"></button></div>
    </section>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <nav class="yard-tools"><button id="foodBtn" data-copy="pantry"></button><button id="adoptBtn" data-copy="adopt"></button><button id="pairBtn" data-copy="pair"></button><button id="helpBtn" data-copy="help"></button></nav>
   </div>
   <div id="resultPanel" class="modal-layer" hidden><section class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><small data-copy="wellDone"></small><h2 id="resultTitle"></h2><p id="resultReward"></p><button id="nextBtn" data-copy="next"></button><button id="retryBtn" data-copy="retry"></button><button id="resultYard" data-copy="freeYard"></button><button id="resultStages" data-copy="missions"></button></section></div>
   <div id="panel" class="modal-layer" hidden><section class="panel-card" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><header><h2 id="panelTitle"></h2><button id="closePanel" aria-label="Close">×</button></header><div id="panelContent"></div><p id="panelFeedback" class="feedback" aria-live="polite"></p></section></div>
  </section>
 </div>
 <section id="mainGuide" class="game-page-info" data-wp-main-guide><h2 data-copy="help"></h2><p data-copy="guide"></p><div class="game-info-facts"></div><div class="game-info-sections"></div><div class="game-info-faq"></div><div class="game-info-related"></div></section>
 <label hidden><select id="localeSelect" aria-label="Language"><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="pt-BR">Português</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="ru">Русский</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select></label>
 <p id="saveWarning" role="status" hidden></p>
 <script src="/src/site-config.js"></script><script src="/src/i18n.js"></script><script src="/src/game-screen-frame.js"></script><script src="/src/stage-rail-i9.js"></script><script src="/src/game-play-ui.js"></script><script type="module" src="game.mjs"></script>
</body></html>
