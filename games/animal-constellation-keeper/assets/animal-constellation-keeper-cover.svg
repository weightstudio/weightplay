<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Constellation Keeper concept cover</title>
  <desc id="desc">A moonlit meadow with a friendly owl keeper and three connected animal stars.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07172f"/><stop offset="1" stop-color="#214f68"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153a52"/><stop offset="1" stop-color="#0c2439"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="700" rx="36" fill="url(#sky)"/>
  <circle cx="730" cy="130" r="78" fill="#ffe7a2" opacity=".9"/><circle cx="760" cy="110" r="78" fill="#0b2340"/>
  <path d="M0 560 Q190 430 380 550 T900 490 V700 H0Z" fill="url(#hill)"/>
  <g fill="none" stroke="#b7f3db" stroke-width="5" opacity=".74"><path d="M205 205 L390 125 L560 250 L205 205"/><path d="M390 125 L560 250"/></g>
