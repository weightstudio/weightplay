  <g transform="translate(115 315)"><ellipse cx="170" cy="170" rx="120" ry="135" fill="#9ad7c5"/><circle cx="125" cy="125" r="43" fill="#173d5d"/><circle cx="215" cy="125" r="43" fill="#173d5d"/><circle cx="125" cy="125" r="15" fill="#ffd166"/><circle cx="215" cy="125" r="15" fill="#ffd166"/><path d="M154 158 L170 180 L186 158" fill="#ffd166"/><path d="M95 70 L125 20 L150 75 M190 75 L215 20 L245 70" fill="#7ccab5"/></g>
  <g fill="#d6fff1" font-family="system-ui,sans-serif" text-anchor="middle"><text x="450" y="620" font-size="44" font-weight="800">CONSTELLATION KEEPER</text><text x="450" y="662" font-size="22" opacity=".78">read the sky · choose the truth</text></g>
