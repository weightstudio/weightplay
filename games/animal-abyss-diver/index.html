<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="robots" content="noindex,nofollow" /><meta id="pageDescription" name="description" content="Choose a route, recover deep-sea relics, and surface before oxygen runs out." /><title>Animal Abyss Diver - WeightPlay</title><link rel="stylesheet" href="../../src/game-page-info.css" /><link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="tutorial.css" /><style>#resultRewards span{display:grid;place-items:center;min-height:48px}#resultRewards span:last-child{border-color:#d7b952;color:#ffe89b}@media(max-height:500px){.battle-canvas{grid-template-rows:58px 50px minmax(0,1fr) 112px}.controls{grid-template-rows:42px;gap:6px;padding:6px 10px}.controls button{height:100%}.battle-hud span{font-size:.76rem}.result{grid-template-columns:none}.result h2,.result p,#resultRewards{grid-column:auto}}</style></head><body><main class="app">
<header id="mainHeader" class="topbar"><a id="homeLink" class="home-link" data-wp-return="main" href="/" aria-label="Back to lobby"><span>&larr;</span><img src="../../assets/weightplay-logo.png" alt="" /></a><h1 id="title"></h1><label><span id="languageLabel"></span><select id="localeSelect" aria-label="Language"><option value="en">English</option><option value="zh-Hant">&#32321;&#39636;&#20013;&#25991;</option></select></label></header>
<style>.stage-screen{grid-template-rows:48px minmax(44px,auto) minmax(0,1fr) 56px!important}.stage-screen>#stageHint{margin:0;display:flex;align-items:center;min-height:44px;line-height:1.35}</style>
<section id="mainScreen" class="main-screen"><img class="cover" src="../../assets/animal-abyss-diver-cover.png" alt="" /><h2 id="headline"></h2><p id="intro"></p><div id="progress" class="progress"></div><button id="startBtn" class="primary"></button><section class="guide"><h2 id="guideTitle"></h2><p id="guideCopy"></p></section></section>
<section id="stageScreen" class="stage-screen wp-stage-art-shell hidden" data-wp-stage-art="../../assets/animal-abyss-diver-cover.png" style="--wp-stage-art: url('../../assets/animal-abyss-diver-cover.png')"><header><button id="stageBack" class="return" data-wp-return="stage" aria-label="Back">&larr;</button><strong id="stageTitle"></strong></header><p id="stageHint"></p><div id="routeRail" class="route-rail"></div><div class="ad-reserve" aria-hidden="true"></div></section>
<section id="battleShell" class="battle-shell hidden"><div class="battle-canvas"><header class="battle-hud"><button id="battleBack" class="return" data-wp-return="battle" aria-label="Back">&larr;</button><strong id="battleTitle"></strong><span id="zoneText"></span><div class="oxygen-meter"><span id="oxygenText"></span><i><b id="oxygenBar"></b></i></div><span id="diamondText" class="diamond-balance"><img src="../../assets/weightplay-diamond.svg" alt="" /><b>0</b></span></header><div class="objective"><span id="objectiveText"></span><span id="salvageText"></span></div><div id="diveField" class="dive-field"><img class="field-bg" src="../../assets/animal-abyss-diver-abyss-bg.png" alt="" /><div class="depth-track" aria-hidden="true"><i id="depthProgress"></i></div><div id="leftGate" class="lane-gate lane-gate-left"><img alt="" /><strong></strong><small></small></div><div id="rightGate" class="lane-gate lane-gate-right"><img alt="" /><strong></strong><small></small></div><section id="fishEncounter" class="fish-encounter hidden" aria-labelledby="fishTitle"><div id="fishSprite" class="fish-sprite"><img src="../../assets/animal-reef-fisher-fish-sheet-a.png" alt="" /></div><strong id="fishTitle"></strong><p id="fishTell"></p><div class="fish-guard"><span id="fishGuardText"></span><i><b id="fishGuardBar"></b></i></div><div class="fish-timer"><span id="fishTimerText"></span><i><b id="fishTimerBar"></b></i></div><div class="fish-actions"><button id="dodgeLeftBtn" type="button"></button><button id="pulseBtn" type="button"></button><button id="dodgeRightBtn" type="button"></button></div></section><img id="diverArt" class="diver-art" src="../../assets/animal-abyss-diver-nori.png" alt="" /><img id="fxArt" class="fx-art hidden" src="../../assets/animal-abyss-diver-fx.png" alt="" /><div id="impactText" class="impact-text hidden" aria-hidden="true"></div><button id="helpBtn" class="help-button" type="button" aria-label="How to play">?</button><p id="feedback" aria-live="polite"></p><section id="diveCoach" class="dive-coach hidden" role="dialog" aria-modal="true" aria-labelledby="coachTitle"><div class="coach-card"><h2 id="coachTitle"></h2><ol><li id="coachStep1"></li><li id="coachStep2"></li><li id="coachStep3"></li></ol><button id="coachStart" class="primary" type="button"></button></div></section></div><div class="controls"><div class="lane-controls"><button id="leftBtn"></button><button id="rightBtn"></button></div><div class="utility-controls"><button id="sonarBtn"></button><button id="shieldBtn"></button><button id="surfaceBtn"></button><button id="beaconBtn"></button></div></div><section id="result" class="result hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultCopy"><h2 id="resultTitle"></h2><p id="resultCopy"></p><div id="resultRewards"></div><button id="nextBtn" class="primary"></button><button id="menuBtn" class="secondary"></button></section></div><div class="ad-reserve" aria-hidden="true"></div></section>
</main><script src="../../src/wallet.js"></script><script src="game.js"></script><script src="../../src/game-page-info.js"></script></body></html>
