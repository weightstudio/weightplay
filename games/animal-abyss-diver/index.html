<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="robots" content="noindex,nofollow" /><meta id="pageDescription" name="description" content="Choose a route, recover deep-sea relics, and surface before oxygen runs out." /><title>Animal Abyss Diver - WeightPlay</title><link rel="stylesheet" href="../../src/game-page-info.css" /><link rel="stylesheet" href="style.css" /></head><body><main class="app">
<header id="mainHeader" class="topbar"><a id="homeLink" class="home-link" data-wp-return="main" href="/" aria-label="Back to lobby"><span>&larr;</span><img src="../../assets/weightplay-logo.png" alt="" /></a><h1 id="title"></h1><label><span id="languageLabel"></span><select id="localeSelect" aria-label="Language"><option value="en">English</option><option value="zh-Hant">&#32321;&#39636;&#20013;&#25991;</option></select></label></header>
<style>.stage-screen{grid-template-rows:48px minmax(44px,auto) minmax(0,1fr) 56px!important}.stage-screen>#stageHint{margin:0;display:flex;align-items:center;min-height:44px;line-height:1.35}</style>
<section id="mainScreen" class="main-screen"><img class="cover" src="../../assets/animal-abyss-diver-cover.png" alt="" /><h2 id="headline"></h2><p id="intro"></p><div id="progress" class="progress"></div><button id="startBtn" class="primary"></button><section class="guide"><h2 id="guideTitle"></h2><p id="guideCopy"></p></section></section>
<section id="stageScreen" class="stage-screen wp-stage-art-shell hidden" data-wp-stage-art="../../assets/animal-abyss-diver-cover.png" style="--wp-stage-art: url('../../assets/animal-abyss-diver-cover.png')"><header><button id="stageBack" class="return" data-wp-return="stage" aria-label="Back">&larr;</button><strong id="stageTitle"></strong></header><p id="stageHint"></p><div id="routeRail" class="route-rail"></div><div class="ad-reserve" aria-hidden="true"></div></section>
<section id="battleShell" class="battle-shell hidden"><div class="battle-canvas"><header class="battle-hud"><button id="battleBack" class="return" data-wp-return="battle" aria-label="Back">&larr;</button><strong id="battleTitle"></strong><span id="zoneText"></span><span id="oxygenText"></span><span id="diamondText" class="diamond-balance"><img src="../../assets/weightplay-diamond.svg" alt="" /><b>0</b></span></header><div class="objective"><span id="objectiveText"></span><span id="salvageText"></span></div><div id="diveField" class="dive-field"><img class="field-bg" src="../../assets/animal-abyss-diver-abyss-bg.png" alt="" /><img id="hazardArt" class="hazard-art" src="../../assets/animal-abyss-diver-hazards.png" alt="" /><img id="relicArt" class="relic-art" src="../../assets/animal-abyss-diver-relics.png" alt="" /><img id="diverArt" class="diver-art" src="../../assets/animal-abyss-diver-nori.png" alt="" /><img id="fxArt" class="fx-art hidden" src="../../assets/animal-abyss-diver-fx.png" alt="" /><p id="feedback"></p></div><div class="controls"><button id="leftBtn"></button><button id="sonarBtn"></button><button id="beaconBtn"></button><button id="surfaceBtn"></button><button id="rightBtn"></button></div></div><div class="ad-reserve" aria-hidden="true"></div></section>
<section id="result" class="result hidden"><h2 id="resultTitle"></h2><p id="resultCopy"></p><div id="resultRewards"></div><button id="nextBtn" class="primary"></button><button id="menuBtn" class="secondary"></button></section>
</main><script src="../../src/wallet.js"></script><script src="game.js"></script></body></html>
