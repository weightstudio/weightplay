  </head>
  <body>
    <main class="garden-game" data-wp-logical-battle-canvas>
      <header class="topbar">
        <a id="homeLink" class="home-link" data-wp-return="main" href="/" aria-label="Back to lobby"><span aria-hidden="true">&larr;</span><img src="../../assets/weightplay-logo.png" alt="" draggable="false" /></a>
        <div class="title-block">
          <p>WeightPlay</p>
          <h1 id="titleText">Pet Garden Tiles</h1>
        </div>
        <label class="language-picker">
          <span id="languageLabel">Language</span>
          <select id="localeSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="zh-Hant">&#32321;&#39636;&#20013;&#25991;</option>
          </select>
        </label>
      </header>

      <section id="mainPanel" class="main-panel">
        <img class="main-poster" src="../../assets/garden-tiles-cover.webp" alt="" />
        <h2 id="mainTitle">Pet Garden Tiles</h2>
        <p id="mainIntro">Remember the garden pictures and match every pair across ten levels.</p>
        <button id="startBtn" type="button">Choose Level</button>
      </section>

      <section id="statusbar" class="statusbar hidden" aria-label="Game status">
        <div>
          <span id="levelLabel">Level</span>
          <strong id="levelText">1 / 10</strong>
        </div>
        <div>
          <span id="movesLabel">Moves</span>
          <strong id="movesText">0</strong>
        </div>
        <div>
          <span id="pairsLabel">Pairs</span>
          <strong id="pairsText">0 / 0</strong>
        </div>
      </section>

      <section id="levelSelect" class="level-select hidden">
        <header class="wp-standard-stage-heading"><button id="levelBackBtn" data-wp-return="stage" type="button" aria-label="Back">&larr;</button><h2 id="levelSelectTitle">Choose Level</h2></header>
        <div id="levelGrid" class="level-grid"></div>
        <div id="levelMessage" class="message" aria-live="polite"></div>
      </section>

      <section id="boardPanel" class="board-panel hidden" data-no-mobile-immersive="true">
        <button id="battleBackBtn" class="play-return" data-wp-return="battle" type="button" aria-label="Back to levels">&larr;</button>
        <div id="board" class="tile-board" aria-label="Garden tile board"></div>
        <div id="message" class="message" aria-live="polite"></div>
      </section>

      <section id="resultPanel" class="result-panel hidden" role="dialog" aria-modal="true">
        <div class="result-card">
          <h2 id="resultTitle">Level Clear</h2>
          <div id="stars" class="stars">&#9734;&#9734;&#9734;</div>
          <p id="resultText">Great matching.</p>
          <div class="result-actions">
            <button id="nextBtn" type="button">Next Level</button>
            <button id="againBtn" type="button">Play Again</button>
            <button id="levelsBtn" type="button">Levels</button>
            <a id="lobbyLink" href="/">Lobby</a>
          </div>
        </div>
      </section>

      <section id="loadingPanel" class="loading-panel">
        <div class="loading-card">
          <strong id="loadingTitle">Loading</strong>
          <span>100%</span>
          <div><i></i></div>
        </div>
      </section>
    </main>
    <div id="stageAdReserve" class="stage-ad-reserve hidden" aria-hidden="true"></div>
    <div id="battleAdReserve" class="battle-ad-reserve hidden" aria-hidden="true"></div>

    <script src="../../src/site-config.js?v=20260710-garden-stable-match1"></script>
    <script src="../../src/version.js?v=20260701-version2"></script>
    <script src="../../src/analytics.js?v=20260701-analytics2"></script>
    <script>
      window.WonderAnalytics?.track("game_view", { game_id: "garden-tiles" });
    </script>
    <script src="../../src/sound.js?v=20260701-labels1"></script>
    <script src="../../src/edge-guard.js?v=20260710-mobile-play-shell2"></script>
    <script src="../../src/i18n.js?v=20260703-i18n-clean1"></script>
    <script src="../../src/tutorial.js?v=20260702-tutorial-locale1"></script>
    <script src="game.js?v=20260712-expanded-canvas1"></script>
    <script>
      (() => {
        const loadGameInfo = () => {
          if (document.querySelector("script[data-garden-game-info]")) return;
          const script = document.createElement("script");
          script.src = "../../src/game-page-info.js?v=20260706-guide-age-layers1";
          script.dataset.gardenGameInfo = "idle";
          script.async = true;
          document.body.appendChild(script);
        };
        const schedule = () => {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadGameInfo, { timeout: 1600 });
          } else {
            window.setTimeout(loadGameInfo, 350);
          }
        };
        if (document.readyState === "complete") schedule();
        else window.addEventListener("load", schedule, { once: true });
      })();
    </script>
  </body>
</html>
