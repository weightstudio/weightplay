<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Petal Pilot concept cover</title>
  <desc id="desc">A moonlit flower with pink petals and two glowing nectar lights.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="20%"><stop offset="0" stop-color="#42617f"/><stop offset="1" stop-color="#071525"/></radialGradient>
    <radialGradient id="moon"><stop stop-color="#fff3b0"/><stop offset="1" stop-color="#f7b75d"/></radialGradient>
    <linearGradient id="petal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffe0eb"/><stop offset="1" stop-color="#d9699b"/></linearGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#235c59"/><stop offset="1" stop-color="#0b252e"/></linearGradient>
  </defs>
  <rect width="720" height="720" rx="42" fill="url(#sky)"/>
  <circle cx="560" cy="142" r="76" fill="#fff4c7" opacity=".85"/>
  <circle cx="560" cy="142" r="59" fill="#fff8dc"/>
  <path d="M0 548 Q120 500 240 558 T480 548 T720 530 V720 H0Z" fill="url(#ground)"/>
  <path d="M328 720 C332 620 336 530 360 420" fill="none" stroke="#94d7a5" stroke-width="18" stroke-linecap="round"/>
  <g transform="translate(360 370)">
    <circle r="86" fill="#163b4b" stroke="#9de0cb" stroke-width="5"/>
    <g fill="url(#petal)" stroke="#ffb6d0" stroke-width="4">
      <ellipse rx="48" ry="128" transform="rotate(0) translate(0 -58)"/>
      <ellipse rx="48" ry="128" transform="rotate(60) translate(0 -58)"/>
      <ellipse rx="48" ry="128" transform="rotate(120) translate(0 -58)"/>
      <ellipse rx="48" ry="128" transform="rotate(180) translate(0 -58)"/>
      <ellipse rx="48" ry="128" transform="rotate(240) translate(0 -58)"/>
      <ellipse rx="48" ry="128" transform="rotate(300) translate(0 -58)"/>
    </g>
    <circle r="36" fill="url(#moon)" stroke="#ffe9a1" stroke-width="6"/>
    <circle cx="-132" cy="-62" r="17" fill="#ffe99b"/><circle cx="132" cy="-62" r="17" fill="#ffe99b"/>
    <path d="M-20 8 Q-130 -70 -132 -62 M20 8 Q130 -70 132 -62" fill="none" stroke="#c5f3d0" stroke-width="5" stroke-dasharray="8 12" opacity=".85"/>
  </g>
  <g fill="#a9e7b1" opacity=".8"><circle cx="96" cy="588" r="8"/><circle cx="135" cy="624" r="5"/><circle cx="612" cy="585" r="7"/><circle cx="670" cy="620" r="4"/></g>
</svg>
