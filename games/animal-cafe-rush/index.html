  <body>
    <main class="cafe-app" data-no-mobile-immersive="true">
      <header class="topbar">

      <section id="menuPanel" class="menu-panel">
        <img class="cover" src="../../assets/animal-cafe-rush-cover.webp" alt="Animal Cafe Rush poster" />
        <div class="menu-copy">
          <span class="eyebrow" data-ui="internal">Cafe open</span>
          <h2 data-ui="menuTitle">Serve the animal cafe.</h2>
          <p data-ui="menuHint">Pick the food shown in a customer's bubble, then tap that customer to serve.</p>

        <div id="playMessage" class="play-message" aria-live="polite"></div>
