  <body>
    <main class="fruit-game">
      <header class="topbar">
        <a class="home-link" href="/" aria-label="Back to lobby">&larr;</a>
        <div class="title-block">
          <p>WeightPlay</p>
          <h1 id="titleText">Animal Merge Tower</h1>
        </div>
        <label class="language-picker">
          <span id="languageLabel">Language</span>
          <select id="localeSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="zh-Hant">&#32321;&#39636;&#20013;&#25991;</option>
          </select>
        </label>
      </header>

      <section id="playPanel" class="fixed-shell-host">
        <div class="fixed-game-shell play-area" aria-label="Animal Merge Tower fixed game screen">
          <section class="scorebar" aria-label="Score">
            <div>
              <span id="scoreLabel">Score</span>
              <strong id="scoreText">0</strong>
            </div>
            <div>
              <span id="bestLabel">Best</span>
              <strong id="bestText">0</strong>
            </div>
            <div>
              <span id="nextLabel">Next</span>
              <strong id="nextFruitText" class="next-fruit-preview" aria-label="Mouse Ball"></strong>
            </div>
            <div id="comboBox" class="combo-box">
              <span id="comboLabel">Combo</span>
              <strong id="comboText">Ready</strong>
            </div>
          </section>

          <section class="merge-goal" aria-label="Merge progress">
            <div class="goal-token" id="largestFruitToken"></div>
            <div class="goal-copy">
              <span id="largestLabel">Largest</span>
              <strong id="largestFruitText">Mouse Ball</strong>
              <div class="goal-track"><i id="goalFill"></i></div>
            </div>
            <span id="goalText" class="goal-text">Goal: Lion King Ball</span>
          </section>

          <section class="board-shell">
            <canvas id="gameCanvas" width="720" height="1040" aria-label="Fruit merge game board"></canvas>
            <div id="toast" class="toast hidden" aria-live="polite"></div>
          </section>

          <section class="controls">
            <button id="dropBtn" type="button">Drop</button>
            <button id="restartBtn" type="button">Restart</button>
          </section>
        </div>
      </section>

      <section id="menuPanel" class="menu-panel">
        <div>
          <h2 id="menuTitle">Merge to the Lion King</h2>
          <p id="menuDesc">Drop animal balls carefully. Matching animals merge into the next bigger animal.</p>
          <div id="chainPreview" class="chain-preview" aria-live="polite"></div>
          <div id="menuMilestone" class="milestone-panel" aria-live="polite"></div>
          <div id="menuLeaderboard" class="leaderboard-panel" aria-live="polite"></div>
        </div>
        <button id="startBtn" type="button">Start</button>
      </section>

      <section id="resultPanel" class="result-panel hidden" role="dialog" aria-modal="true">
        <div class="result-card">
          <h2 id="resultTitle">Game Over</h2>
          <div id="resultText" class="result-report">Score 0</div>
          <div id="resultMilestone" class="milestone-panel" aria-live="polite"></div>
          <div id="resultLeaderboard" class="leaderboard-panel" aria-live="polite"></div>
          <div class="result-actions">
            <button id="playAgainBtn" type="button">Play Again</button>
            <a href="/" id="lobbyLink">Lobby</a>
          </div>
        </div>
      </section>

      <section id="loadingPanel" class="loading-panel">
        <div class="loading-card">
          <strong id="loadingTitle">Loading</strong>
          <span id="loadingText">100%</span>
          <div><i id="loadingFill"></i></div>
        </div>
      </section>
    </main>

    <script src="../../src/site-config.js?v=20260707-merge-milestone1"></script>
    <script src="../../src/version.js?v=20260701-version2"></script>

      window.WonderAnalytics?.track("game_view", { game_id: "fruit-merge" });
    </script>
    <script src="../../src/sound.js?v=20260701-labels1"></script>
    <script src="../../src/edge-guard.js?v=20260703-play-frame1"></script>
    <script src="../../src/i18n.js?v=20260703-i18n-clean1"></script>
    <script src="../../src/tutorial.js?v=20260702-tutorial-locale1"></script>
    <script src="../../src/vendor/matter.min.js?v=20260630-matter1"></script>
    <script src="../../src/vendor/matter-global.js?v=20260630-matter1"></script>
    <script src="game.js?v=20260707-merge-milestone1"></script>
    <script>
      (() => {
        const loadGameInfo = () => {
          if (document.querySelector("script[data-merge-game-info]")) return;
          const script = document.createElement("script");
          script.src = "../../src/game-page-info.js?v=20260706-guide-age-layers1";
          script.dataset.mergeGameInfo = "idle";
          document.body.appendChild(script);
        };
        const schedule = () => {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadGameInfo, { timeout: 1600 });
          } else {
            window.setTimeout(loadGameInfo, 350);
          }
        };
        if (document.readyState === "complete") schedule();
        else window.addEventListener("load", schedule, { once: true });
      })();
    </script>
  </body>
