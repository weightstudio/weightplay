<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="weightplay-audience" content="general"><title>Pong | WeightPlay</title><link rel="stylesheet" href="../../src/popular-games-batch.css"><style>
@media (orientation: landscape) and (max-height: 430px) {
  body[data-game-id="pong"][data-screen="battle"],
  body[data-game-id="pong"][data-screen="result"] { overflow: hidden; }
  body[data-game-id="pong"][data-screen="battle"] .popular-arcade,
  body[data-game-id="pong"][data-screen="result"] .popular-arcade {
    height: 100dvh;
    min-height: 0;
    padding: 6px;
    gap: 0;
  }
  body[data-game-id="pong"][data-screen="battle"] .arcade-header,
  body[data-game-id="pong"][data-screen="battle"] .arcade-footer,
  body[data-game-id="pong"][data-screen="result"] .arcade-header,
  body[data-game-id="pong"][data-screen="result"] .arcade-footer { display: none; }
  body[data-game-id="pong"][data-screen="battle"] #battleScreen {
    min-height: 0;
    height: 100%;
  }
  body[data-game-id="pong"][data-screen="battle"] .battle-panel {
    height: 100%;
    min-height: 0;
    padding: 7px;
    gap: 6px 12px;
    align-content: stretch;
    grid-template-columns: minmax(360px, 1fr) minmax(250px, .85fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  body[data-game-id="pong"][data-screen="battle"] .board-wrap {
    grid-column: 1;
    grid-row: 1 / 4;
    min-height: 0;
    padding: 5px;
  }
  body[data-game-id="pong"][data-screen="battle"] .board {
    height: 100%;
    min-height: 0;
  }
  body[data-game-id="pong"][data-screen="battle"] .pong-board {
    width: min(100%, 560px);
    height: min(250px, 100%);
  }
  body[data-game-id="pong"][data-screen="battle"] .battle-top { grid-column: 2; grid-row: 1; }
  body[data-game-id="pong"][data-screen="battle"] .game-message {
    grid-column: 2;
    grid-row: 2;
    align-self: start;
  }
  body[data-game-id="pong"][data-screen="battle"] #controls { grid-column: 2; grid-row: 3; }
  body[data-game-id="pong"][data-screen="battle"] #controls .control-row { flex-wrap: nowrap; }
  body[data-game-id="pong"][data-screen="result"] #resultScreen {
    min-height: 0;
    height: 100%;
  }
  body[data-game-id="pong"][data-screen="result"] #resultScreen .arcade-panel {
    min-height: 0;
    height: 100%;
    padding: 16px;
    gap: 10px;
  }
}
</style></head>
<body><main id="popularArcade" class="popular-arcade"><header class="arcade-header"><div><div id="eyebrow" class="eyebrow"></div><h1 id="gameTitle"></h1><p id="gameTagline" class="tagline"></p></div><label class="locale-picker"><span id="languageLabel">Language</span><select id="localeSelect"></select></label></header><section id="mainScreen" class="screen"><div class="arcade-panel main-panel"><div class="main-copy"><p id="objective" class="objective"></p><p>Use visible controls to play a complete short round, then review the Result.</p><button id="startBtn" class="primary">Start game</button></div><div class="preview-art" aria-hidden="true">⊙</div></div></section><section id="battleScreen" class="screen" hidden><div class="arcade-panel battle-panel"><div class="battle-top"><span id="roundLabel" class="round-label"></span><div class="control-row"><button id="hintBtn" class="secondary"></button><button id="restartBtn" class="secondary"></button></div></div><div class="board-wrap"><div id="board" class="board"></div></div><p id="gameMessage" class="game-message" aria-live="polite"></p><div id="controls"></div></div></section><section id="resultScreen" class="screen" hidden><div class="arcade-panel"><h2 id="resultTitle"></h2><p id="resultCopy" class="tagline"></p><div id="resultStats" class="stats"></div><div class="result-actions"><button id="retryBtn" class="primary"></button><button id="homeBtn" class="secondary"></button></div></div></section><footer class="arcade-footer" id="footerText"></footer></main><script src="../../src/popular-games-batch.js"></script><script src="game.js?v=20260814-hint-v2"></script></body>
</html>
