<!doctype html>
<html lang="en">
  <head>
    <script>
      if (
        /^https?:$/.test(location.protocol) &&
        new URLSearchParams(location.search).get("trial") !== "1"
      )
        location.replace("/");
    </script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="weightplay-audience" content="general" />
    <title>Unblock Trail | WeightPlay</title>
    <link
      rel="stylesheet"
      href="../../src/stage-selector-standard.css"
      data-wp-stage-standard
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../src/game-shell-controls-standard.css?v=20260726-shell1">
</head>
  <body data-wp-game-id="animal-unblock">
    <main id="main" class="screen main">
      <header>
        <a href="/" data-t-aria="returnLobby" aria-label="Return to WeightPlay"
          >←</a
        >
        <strong data-t="shortTitle">UNBLOCK</strong>
        <select id="locale"></select>
      </header>
      <section class="hero">
        <img
          src="../../assets/animal-unblock-cover-general-v3.webp"
          data-t-alt="coverAlt"
          alt="Panko moving trail blocks through a bamboo grove"
        />
        <div>
          <p data-t="kicker">PANKO'S SLIDE PUZZLE</p>
          <h1 data-t="title">Unblock Trail</h1>
          <p data-t="summary"></p>
          <button id="start" data-wp-main-start data-t="start">
            Start game
          </button>
          <details>
            <summary data-t="guideTitle"></summary>
            <p data-t="guideBody"></p>
          </details>
        </div>
      </section>
    </main>
    <main
      id="stage"
      class="screen canvas stage-canvas"
      data-wp-standard-stage-screen
      data-wp-logical-stage-canvas
      data-wp-canvas-max-width="920"
      data-wp-stage-landscape-width="760"
      data-wp-stage-landscape-height="334"
      style="--wp-stage-art: url('../../assets/animal-unblock-cover-general-v3.webp')"
      hidden
    >
      <header>
        <button data-back data-t-aria="back" aria-label="Back">←</button>
        <h2 data-t="choose"></h2>
        <span id="progress"></span>
      </header>
      <section
        id="stageGrid"
        class="stage-rail"
        data-wp-stage-rail
        data-wp-stage-recommendation="last"
        data-t-aria="stageList"
        aria-label="Trail list"
      ></section>
    </main>
    <main id="battle" class="screen canvas" hidden>
      <header>
        <button data-back data-t-aria="back" aria-label="Back">←</button>
        <div>
          <small id="chapter"></small>
          <h2 id="trailName"></h2>
        </div>
        <span id="moveCount"></span>
      </header>
      <section class="battle">
        <div
          id="board"
          data-t-aria="boardLabel"
          aria-label="Unblock Trail game board"
        ></div>
        <div class="tools">
          <button id="undo" data-t="undo"></button>
          <button id="hint" data-t="hint"></button>
          <button id="restart" data-t="restart"></button>
        </div>
        <p id="status"></p>
      </section>
    </main>
    <aside id="generalReserve" hidden aria-hidden="true"></aside>
    <dialog id="result">
      <img
        class="result-character"
        src="../../assets/weightplay-character-drum-belly-panda-safe-face-cutout.webp"
        alt=""
      />
      <h2 data-t="resultTitle"></h2>
      <p id="resultBody"></p>
      <button id="retry" data-t="retry"></button>
      <button id="next" data-t="next"></button>
    </dialog>
    <script src="../../src/site-config.js"></script>
    <script>
      window.WONDER_SITE.localization.useLocaleRoutes = false;
    </script>
    <script src="../../src/i18n.js?v=20260721-locale13-1"></script>
    <script src="../../src/game-runtime-localizer-loader.js?v=20260721-locale13-1"></script>
    <script src="levels.js"></script>
    <script src="locales.js?v=20260726-zh-hant3"></script>
    <script src="game.js"></script>
    <script
      src="../../src/stage-selector-standard.js"
      data-wp-stage-standard
    ></script>
    <script src="../../src/game-shell-controls-standard.js?v=20260726-shell1"></script>
</body>
</html>
