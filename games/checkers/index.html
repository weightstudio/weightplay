<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="weightplay-audience" content="general">
<meta name="description" content="Play a five-move Checkers preview with clear diagonal choices and a promotion payoff.">
<title>Checkers | WeightPlay</title>
<style>
  .preview-art { overflow: hidden; }
  .preview-art img { width: 100%; height: 100%; min-height: 220px; object-fit: cover; border-radius: inherit; display: block; }
  @media (max-width: 700px) { .preview-art img { min-height: 140px; } }
</style>
<link rel="stylesheet" href="../../src/popular-games-batch.css?v=20260824-checkers-public-art-v9">
</head>
<body>
<main id="popularArcade" class="popular-arcade">
  <header class="arcade-header">
    <div><div id="eyebrow" class="eyebrow"></div><h1 id="gameTitle"></h1><p id="gameTagline" class="tagline"></p></div>
    <label class="locale-picker"><span id="languageLabel">Language</span><select id="localeSelect"></select></label>
  </header>
  <section id="mainScreen" class="screen">
    <div class="arcade-panel main-panel">
      <div class="main-copy"><p id="objective" class="objective"></p><p>Use visible controls to play a complete short round, then review the Result.</p><button id="startBtn" class="primary">Start game</button></div>
      <div class="preview-art"><img src="../../assets/checkers-cover.webp" alt="" aria-hidden="true"></div>
    </div>
  </section>
  <section id="battleScreen" class="screen" hidden>
    <div class="arcade-panel battle-panel">
      <div class="battle-top"><span id="roundLabel" class="round-label"></span><div class="control-row"><button id="hintBtn" class="secondary"></button><button id="restartBtn" class="secondary"></button></div></div>
      <div class="board-wrap"><div id="board" class="board"></div></div>
      <p id="gameMessage" class="game-message" aria-live="polite"></p>
      <div id="controls"></div>
    </div>
  </section>
  <section id="resultScreen" class="screen" hidden>
    <div class="arcade-panel"><h2 id="resultTitle"></h2><p id="resultCopy" class="tagline"></p><div id="resultStats" class="stats"></div><div class="result-actions"><button id="retryBtn" class="primary"></button><button id="homeBtn" class="secondary"></button></div></div>
  </section>
  <footer class="arcade-footer" id="footerText"></footer>
</main>
<script src="../../src/site-config.js?v=20260824-checkers-public-art-v9"></script>
<script src="../../src/analytics.js?v=20260824-checkers-public-art-v9"></script>
<script src="../../src/popular-games-batch.js?v=20260824-checkers-public-art-v9"></script>
<script src="game.js"></script>
</body>
</html>
