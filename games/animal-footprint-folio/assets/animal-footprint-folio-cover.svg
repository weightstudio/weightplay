<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Trail Logic field folio</title>
  <desc id="desc">A moonlit teal field note with repeating trail markers and an open clue tile.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2527"/><stop offset=".58" stop-color="#1b5a58"/><stop offset="1" stop-color="#123336"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff4df"/><stop offset="1" stop-color="#b4dcc3"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="900" height="900" rx="48" fill="url(#sky)"/>
  <circle cx="710" cy="150" r="160" fill="#9ae8c7" opacity=".12" filter="url(#blur)"/>
  <path d="M0 720C170 620 280 720 430 645s275-5 470-108v363H0Z" fill="#082123" opacity=".78"/>
  <path d="M90 170c125 35 190 110 290 112 108 2 154-74 288-39 55 14 89 42 142 70" fill="none" stroke="#9ae8c7" stroke-opacity=".3" stroke-width="5" stroke-dasharray="5 20"/>
