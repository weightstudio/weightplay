      <path d="m398 18 25 38-25 38-25-38 25-38Z" fill="none" stroke="#174443" stroke-width="7"/>
    </g>
    <text x="64" y="468" fill="#174443" opacity=".74" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="3">OBSERVE · CHOOSE · CONFIRM</text>
