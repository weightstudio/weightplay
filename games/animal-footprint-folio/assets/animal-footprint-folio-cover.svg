    <rect x="30" y="30" width="555" height="465" rx="14" fill="none" stroke="#174443" stroke-opacity=".3" stroke-width="3"/>
    <text x="54" y="88" fill="#174443" font-family="system-ui,sans-serif" font-size="22" font-weight="800" letter-spacing="5">FIELD NOTE 03</text>
    <text x="54" y="142" fill="#174443" font-family="system-ui,sans-serif" font-size="62" font-weight="900">TRAIL</text>
    <text x="54" y="202" fill="#b36245" font-family="system-ui,sans-serif" font-size="62" font-weight="900">LOGIC</text>
    <path d="M64 270h487" stroke="#174443" stroke-opacity=".3" stroke-width="3"/>
    <g transform="translate(65 314)">
      <rect width="100" height="112" rx="14" fill="#174443" opacity=".16"/><rect x="116" width="100" height="112" rx="14" fill="#174443" opacity=".16"/><rect x="348" width="100" height="112" rx="14" fill="#174443" opacity=".16"/>
      <rect x="232" width="100" height="112" rx="14" fill="#f4c86d" opacity=".38" stroke="#b36245" stroke-width="4" stroke-dasharray="7 8"/>
