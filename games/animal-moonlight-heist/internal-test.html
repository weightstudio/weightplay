<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#101b36" />
  <title>Animal Moonlight Heist - Internal Trial</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../src/stage-selector-standard.css" data-wp-stage-standard />
  <link rel="stylesheet" href="../../src/battle-canvas-standard.css" />
</head>
<body data-screen="main">
  <main id="mainScreen" class="screen main-screen">
    <header class="main-topbar"><a class="home-link" href="/" aria-label="Back to WeightPlay"><span>&larr;</span><img src="../../assets/weightplay-logo.png" alt="" /></a><strong data-i18n="title">Animal Moonlight Heist</strong><select id="localeSelect" aria-label="Language"><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="pt-BR">Português</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="ru">Русский</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select></header>
    <img class="main-poster" src="../../assets/animal-moonlight-heist-cover.webp" alt="" />
    <section class="main-copy"><small data-i18n="internal">Internal Trial</small><h1 data-i18n="title">Animal Moonlight Heist</h1><p data-i18n="pitch">Read the patrols, recover the relic, and choose when to extract.</p><div id="safehouseSummary" class="summary-strip"></div><button id="startBtn" class="primary" type="button" data-i18n="start">Start Game</button></section>
  </main>

  <section id="stageScreen" class="screen stage-shell" hidden>
    <div class="stage-canvas" data-wp-standard-stage-screen>
      <header class="stage-header"><button id="stageBackBtn" class="icon-btn" type="button">&larr;</button><strong data-i18n="missions">Moon Archive</strong><span id="coinLabel"></span></header>
      <section class="planner"><img src="../../assets/animal-moonlight-heist-orla.webp" alt="" /><div class="planner-body"><div class="planner-heading"><strong data-i18n="chooseGadget">Choose Gadget</strong><span id="diamondLabel"></span></div><div class="gadget-row"><div id="gadgetChoices" class="gadget-choices"></div><button id="rerollBtn" class="economy-btn" type="button"></button><button id="insuranceBtn" class="economy-btn" type="button"></button></div><span id="economyFeedback" class="economy-feedback" aria-live="polite"></span></div></section>
      <div id="missionRail" class="mission-rail" aria-label="Missions" data-wp-stage-recommendation="explicit" data-wp-stage-settle-duration="340" data-wp-stage-easing="smoothstep"></div>
    </div>
    <div class="stage-ad-reserve" aria-hidden="true"></div>
  </section>

  <section id="battleScreen" class="screen battle-shell" hidden>
    <div class="battle-canvas">
      <header class="battle-header"><button id="battleBackBtn" class="icon-btn" type="button" data-wp-return="battle">&larr;</button><div><strong id="missionLabel"></strong><span id="objectiveLabel"></span></div><button id="pauseBtn" class="icon-btn" type="button">&#10074;&#10074;</button></header>
      <div class="alert-row"><span data-i18n="alert">Alert</span><div class="alert-track"><i id="alertFill"></i></div><span id="coinBattle"></span></div>
      <section id="playField" class="play-field">
        <div id="routeLine" class="route-line" hidden></div>
        <img id="objectiveActor" class="map-object objective" alt="" />
        <img id="treasureActor" class="map-object treasure" src="../../assets/animal-moonlight-heist-marker-treasure.webp" alt="" />
        <img id="exitActor" class="map-object exit" src="../../assets/animal-moonlight-heist-marker-extraction.webp" alt="" />
        <div id="patrolLayer"></div>
        <img id="fiaActor" class="fia-actor" src="../../assets/animal-moonlight-heist-fia.webp" alt="" />
        <img id="feedbackFx" class="feedback-fx" alt="" hidden />
      </section>
      <div class="battle-controls"><span id="feedbackText" data-i18n="holdRoute">Hold to preview a route.</span><button id="gadgetBtn" class="gadget-btn" type="button"><img id="gadgetIcon" alt="" /><span id="gadgetLabel"></span></button></div>
      <div id="resultModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultText" hidden><section class="modal-card"><img id="resultArt" src="../../assets/animal-moonlight-heist-fx-extraction.webp" alt="" /><h2 id="resultTitle"></h2><p id="resultText"></p><div id="medalRow" class="medals"></div><div class="modal-actions"><button id="stagesBtn" type="button" data-i18n="missions">Missions</button><button id="nextBtn" class="primary" type="button" data-i18n="next">Next Mission</button><button id="retryBtn" type="button" data-i18n="retry">Retry</button></div></section></div>
    </div>
    <div class="battle-ad-reserve" aria-hidden="true"></div>
  </section>

  <script src="../../src/wallet.js"></script>
<script src="game.js?v=20260813-stage-current-v16"></script>
  <script src="../../src/stage-selector-standard.js?v=20260720-canvas-max920-1" data-wp-stage-standard></script>
  <script src="../../src/battle-canvas-standard.js?v=20260720-canvas-max920-1"></script>
</body>
</html>
