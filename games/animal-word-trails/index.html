  <script type="application/json" data-wp-animal-word-trails-guide>{"locale":"en","copy":{"intro":"Explore 60 trails by connecting neighboring letters or characters to find words.","systems":["Tap tiles one by one, then check the word. A drag that adds at least two tiles submits when released. Undo removes the last tile; Clear removes the path.","Diagonals count as neighbors; do not reuse a tile in one word.","Place the leaf bridge across one chosen gap at a time.","Follow the group order, or choose the first group when offered; finish it before the next.","A reusable wild leaf stands for one whole character of the selected word. Use at most one per word.","Hints can lower the stars you earn.","On trail 5, choose the word you want to find before connecting tiles.","On trail 10, find the habitat words in the order shown."],"progression":["Find four words to clear each trail and unlock the next. Trail 60 is the last.","There is no timer. Clears, stars and clue cards stay in this browser."],"designNote":"Each trail has four words. Later trails introduce bridges, group order and wild leaves.","parent":"This Kids reading puzzle is ad-free and needs no account. Progress and records stay in this browser and may be lost if site data is cleared. It is for practice and entertainment, not a formal reading assessment. If browser storage is unavailable, you can keep playing now, but progress may not last after you leave.","metaDescription":"Explore 60 word trails with leaf bridges, animal and nature groups, and reusable wild leaves.","text140Tags":["Word-path puzzle","Animal clues","Reading practice"],"gameplay":"Reading word-path puzzle","genre":["Word puzzle","Reading","Animal"],"story":["Help Leo restore animal and habitat clues to the album, one trail at a time."],"how":["Choose an unlocked trail and find its four words.","Connect neighboring tiles, including diagonals; do not reuse a tile in one word.","When a leaf bridge is available, move it to the gap you want to cross.","Follow the group order and choose a target before using a wild leaf."],"strategyTips":["Look at the targets before tracing.","Move the bridge when another gap is needed.","Choose the target first and use at most one wild leaf in its path."],"faq":[["How many trails are there?","There are 60, with four target words in each."],["How does the leaf bridge work?","It crosses one selected gap at a time and can be moved."],["How does the wild leaf work?","It replaces one whole character in the selected word. You can use it again for another word."],["Are there ads, and where is progress saved?","There are no ads. Progress and clue cards are saved in this browser."]],"difficulty":"Easy to Moderate","time":"2–5 minutes per trail","skills":["Reading","Focus","Logic"]}}</script>
