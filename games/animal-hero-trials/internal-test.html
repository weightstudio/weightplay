<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Animal Hero Trials - Internal Test</title>
  <link rel="stylesheet" href="style.css" />
  <style>#stageView{height:100dvh;min-height:0;overflow:hidden}.stage-rail{min-height:0}.stage-card{padding:8px;gap:4px}.stage-card img{min-height:0}.stage-card span{color:#d9eee4}.stage-card.checkpoint{border:3px solid #ffd45f;box-shadow:0 0 0 2px #8b6424}.stage-card.checkpoint img{object-fit:contain;background:#0b221b}</style>
  <style>#battleView #resultModal{position:absolute;inset:0}#resultHome{min-height:50px;margin-left:6px;border:1px solid #8edbb3;border-radius:10px;background:#0c281f;color:#fff;padding:0 14px;font-weight:900}</style>
  <link rel="stylesheet" href="progress-cards.css" />
  <style>.canvas-wrap canvas:focus-visible{outline:5px solid #ffd45f;outline-offset:-5px}</style>
  <style>.canvas-wrap canvas{position:absolute;left:50%;top:50%;width:auto;height:auto;object-fit:initial;transform:translate(-50%,-50%)}.reroll-row{margin-top:10px;display:grid;gap:5px}.reroll-row button{height:46px;min-height:46px;border:1px solid #8edbb3;border-radius:9px;background:#0c281f;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:900}.reroll-row button.is-confirming{border-color:#ffd45f;background:#3b3315;box-shadow:0 0 0 2px #ffd45f33}.reroll-row button:disabled{opacity:.48}.reroll-row img{width:24px;height:24px;object-fit:contain}.reroll-row small{display:grid;place-items:center;min-height:36px;color:#ffd45f}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal-actions button{min-height:50px;border-radius:10px;font-weight:900}.modal-actions .secondary{border:1px solid #8edbb3;background:#0c281f;color:#fff}</style>
  <style>.hero-picker{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(86px,1fr);gap:7px;overflow-x:auto;scrollbar-width:none}.hero-option{height:112px;border:1px solid #4f8b70;border-radius:9px;background:#102d24;color:#fff;padding:5px;display:grid;grid-template-rows:48px auto auto;justify-items:center;align-content:center;gap:2px}.hero-option.selected{border:2px solid #ffd45f;background:#194635}.hero-option img{width:48px;height:48px;object-fit:contain}.hero-option b{font-size:11px;line-height:1.1;text-align:center}.hero-option small{display:grid;gap:1px;font-size:8px;line-height:1.15;color:#bfe6d2;text-align:center}</style>
  <style>body:not([data-game-view="battle"]) .battle-ad{display:none}</style>
</head>
<body data-game-view="main" data-screen="main" data-sound-toggle="off">
  <main id="app" class="app">
    <section id="mainView" class="view main-view" data-screen="main">
      <a class="lobby-return" href="/" aria-label="Back to WeightPlay"><span>&larr;</span><img src="../../assets/weightplay-logo.png" alt="" /></a>
      <label class="locale"><span>Language</span><select id="locale"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label>
      <img class="cover" src="../../assets/animal-hero-trials-cover.webp" alt="" />
      <div class="main-copy"><h1 data-t="title">Animal Hero Trials</h1><p data-t="pitch">Guide Leo through three forest trials and choose a blessing after every room.</p></div>
      <div class="progress-card"><span><img src="../../assets/animal-hero-trials-icon-trial-gate.png" alt="" aria-hidden="true" /><span class="progress-copy"><b data-t="marks">Trial Marks</b><strong id="markCount">0</strong></span></span><button id="masteryBtn" type="button"><img src="../../assets/animal-hero-trials-icon-heart-mastery.png" alt="" aria-hidden="true" /><span data-t="mastery">Heart Mastery</span><b id="masteryLevel">Lv.0</b><small id="masteryCost">All heroes Max HP +0 → +12 · Need 5 / Have 0 marks</small></button></div>
      <button id="startBtn" class="primary" type="button" data-t="start">Start Game</button>
    </section>

    <section id="stageView" class="view hidden" data-screen="stage">
      <header class="compact-head"><button id="stageBack" class="icon-btn" type="button" aria-label="Back">&larr;</button><h2 data-t="choose">Choose Trial</h2></header>
      <div id="heroPicker" class="hero-picker" aria-label="Choose hero"></div>
      <div id="stageRail" class="stage-rail"></div>
      <div class="stage-ad" aria-hidden="true"></div>
    </section>

    <section id="battleView" class="view battle-view hidden" data-screen="battle">
      <header class="battle-head"><button id="battleBack" class="icon-btn" type="button" aria-label="Back">&larr;</button><div class="health" role="progressbar" aria-valuemin="0"><span id="roomText">Room 1/3</span><div><i id="hpFill"></i></div></div><button id="skillBtn" class="skill-btn" type="button"><img src="../../assets/animal-hero-trials-icon-roaring-mane.webp" alt="" /><span id="cooldownText">ROAR</span></button></header>
      <div class="canvas-wrap"><canvas id="game" width="390" height="560" tabindex="0" aria-describedby="objective controlHint"></canvas><div class="battle-overlay"><p id="objective"></p><small id="controlHint" aria-live="polite" hidden></small></div></div>
      <div id="battleAd" class="battle-ad" aria-hidden="true"></div>
      <div id="choiceModal" class="modal hidden" style="position:absolute" role="dialog" aria-modal="true" aria-labelledby="blessingTitle" aria-describedby="rerollStatus"><section><h2 id="blessingTitle" data-t="blessing">Choose a Blessing</h2><div id="choices" class="choices"></div><div class="reroll-row"><button id="rerollBtn" type="button"><img src="../../assets/weightplay-diamond.svg" alt="" /><span id="rerollLabel">Reroll · 3</span></button><small id="rerollStatus"></small></div></section></div>
      <div id="quitModal" class="modal hidden" style="position:absolute" role="dialog" aria-modal="true" aria-labelledby="quitTitle" aria-describedby="quitCopy"><section><h2 id="quitTitle" data-t="quitTitle">Leave this trial?</h2><p id="quitCopy" data-t="quitCopy">This run's room and blessing progress will be lost.</p><div class="modal-actions"><button id="quitKeep" class="primary" type="button" data-t="keepPlaying">Keep Playing</button><button id="quitLeave" class="secondary" type="button" data-t="leaveTrial">Leave Trial</button></div></section></div>
      <div id="resultModal" class="modal hidden" style="position:absolute" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultCopy"><section><img id="resultFx" src="../../assets/animal-hero-trials-fx-victory.webp" alt="" /><h2 id="resultTitle"></h2><p id="resultCopy"></p><button id="resultNext" class="primary" type="button"></button><button id="resultHome" type="button" data-t="menu">Main Menu</button></section></div>
    </section>

  </main>
  <script src="../../src/sound.js" data-no-floating-toggle="true"></script>
  <script src="../../src/wallet.js"></script>
  <script src="fit.js"></script>
  <script src="game.js?v=20260810-battle-control-hint-v5"></script>
</body>
</html>
