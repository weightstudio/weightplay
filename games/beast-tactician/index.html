<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="index,follow" />
    <meta name="description" content="Build animal defenders, protect the crystal core, and clear 10 forest tower-defense stages in Beast Guardian." />
    <link rel="canonical" href="https://weightplay.com/games/beast-tactician/" />
    <meta property="og:site_name" content="WeightPlay" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Beast Guardian - Free Hero Tower Defense | WeightPlay" />
    <meta property="og:description" content="Build animal defenders, protect the crystal core, and clear 10 forest tower-defense stages." />
    <meta property="og:url" content="https://weightplay.com/games/beast-tactician/" />
    <meta property="og:image" content="https://weightplay.com/assets/beast-tactician-cover.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Beast Guardian - Free Hero Tower Defense | WeightPlay</title>
    <link rel="stylesheet" href="../../src/loading-screen.css?v=20260702-unified1" />
    <link rel="stylesheet" href="../../src/play-viewport.css?v=20260710-mobile-play-shell2" />
    <link rel="stylesheet" href="../../src/tutorial.css?v=20260701-style1" />
    <link rel="stylesheet" href="../../src/game-page-info.css?v=20260710-guardian-public1" />
    <link rel="stylesheet" href="defense.css?v=20260710-guardian-clean-cutouts1" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Beast Guardian",
        "url": "https://weightplay.com/games/beast-tactician/",
        "image": "https://weightplay.com/assets/beast-tactician-cover.webp",
        "description": "Build animal defenders, protect the crystal core, and clear 10 forest tower-defense stages in Beast Guardian.",
        "publisher": {
          "@type": "Organization",
          "name": "WeightStudio",
          "url": "https://weightplay.com/"
        },
        "applicationCategory": "Game",
        "genre": ["Tower Defense", "Strategy"],
        "audience": {
          "@type": "PeopleAudience",
          "suggestedMinAge": 13
        },
        "inLanguage": ["en", "zh-Hant"],
        "isAccessibleForFree": true,
        "operatingSystem": "Web"
      }
    </script>
  </head>
  <body>
    <main class="guardian-app">
      <header class="guardian-topbar">
        <a class="back-btn" href="/" aria-label="Back to lobby">&larr;</a>
        <div class="brand-lockup">
          <span>WeightPlay</span>
          <h1 id="gameTitle">Beast Guardian</h1>
        </div>
        <label class="locale-box">
          <span id="languageLabel">Language</span>
          <select id="localeSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="zh-Hant">繁體中文</option>
          </select>
        </label>
        <button id="soundBtn" class="secondary-btn sound-btn" type="button" aria-pressed="false">SFX Off</button>
      </header>

      <section id="loadingPanel" class="loading-panel" aria-live="polite">
        <div class="loading-content">
          <h2>Beast Guardian</h2>
          <div class="loading-bar"><div id="loadingFill" class="loading-fill"></div></div>
          <span id="loadingText" class="loading-percentage">0%</span>
        </div>
      </section>

      <section id="menuPanel" class="menu-panel">
        <div class="poster-frame">
          <img src="../../assets/beast-tactician-cover.webp" alt="Beast Guardian cover" />
        </div>
        <div class="menu-copy">
          <p id="releaseBadge" class="release-badge">Playable Now</p>
          <h2 id="menuTitle">Hero Tower Defense</h2>
          <p id="menuHint" class="menu-hint"></p>
          <div class="profile-grid">
            <div><span id="bestStageLabel">Best Stage</span><strong id="bestStageText">1</strong></div>
            <div><span id="upgradePointLabel">Upgrade Points</span><strong id="upgradePointText">0</strong></div>
            <div><span id="diamondLabel">Diamonds</span><strong id="diamondText">0</strong></div>
          </div>
          <div class="menu-actions">
            <button id="startBtn" class="primary-btn" type="button">Start Defense</button>
            <button id="techBtn" class="secondary-btn" type="button">Tech Upgrades</button>
          </div>
          <p id="holdNotice" class="hold-notice"></p>
        </div>
      </section>

      <section id="techPanel" class="modal-panel is-hidden" aria-live="polite">
        <div class="modal-card">
          <h2 id="techTitle">Permanent Tech</h2>
          <p id="techHint"></p>
          <div id="techGrid" class="tech-grid"></div>
          <button id="techBackBtn" class="secondary-btn" type="button">Back</button>
        </div>
      </section>

      <section id="stagePanel" class="stage-panel is-hidden">
        <div class="stage-header">
          <h2 id="stageTitle">Choose Stage</h2>
          <button id="stageBackBtn" class="secondary-btn" type="button">Menu</button>
        </div>
        <div id="stageRail" class="stage-rail" aria-label="Stage selector"></div>
      </section>

      <section id="gamePanel" class="game-panel play-area is-hidden" data-play-viewport>
        <div class="hud-row">
          <button id="menuBtn" class="secondary-btn" type="button" aria-label="Back to stages">Menu</button>
          <div><span id="stageHudLabel">Stage</span><strong id="stageHudText">1</strong></div>
          <div><span id="coreHudLabel">Core</span><strong id="coreText">100</strong></div>
          <div><span id="coinHudLabel">Coins</span><strong id="coinText">0</strong></div>
          <div><span id="waveHudLabel">Wave</span><strong id="waveText">0/0</strong></div>
          <div id="waveIntelPanel" class="wave-intel-panel" aria-live="polite">
            <span id="waveIntelLabel">Next Wave</span>
            <strong id="waveIntelText">Scout the route before starting.</strong>
          </div>
          <button id="speedBtn" class="secondary-btn" type="button">1x</button>
        </div>
        <div id="bossPanel" class="boss-panel is-hidden" aria-live="polite">
          <div>
            <span id="bossLabel">Boss Pressure</span>
            <strong id="bossNameText">Forest Behemoth</strong>
          </div>
          <div class="boss-meter" aria-hidden="true"><div id="bossMeterFill"></div></div>
          <span id="bossHpText">100%</span>
          <span id="bossHintText">Hold the route</span>
        </div>
        <div class="battle-layout">
          <aside class="build-panel">
            <h3 id="buildTitle">Build</h3>
            <div id="buildCards" class="build-cards"></div>
            <div id="selectedInfo" class="selected-info"></div>
          </aside>
          <div class="canvas-shell">
            <canvas id="gameCanvas" width="960" height="640" tabindex="0" aria-label="Beast Guardian tower defense board"></canvas>
            <div id="toast" class="toast is-hidden"></div>
          </div>
        </div>
        <div class="command-row">
          <button id="waveBtn" class="primary-btn" type="button">Start Wave</button>
          <button id="upgradeBtn" class="secondary-btn" type="button">Upgrade</button>
          <button id="sellBtn" class="secondary-btn" type="button">Sell</button>
          <button id="reviveBtn" class="secondary-btn" type="button">Revive Core</button>
        </div>
      </section>

      <div class="battle-ad-reserve" aria-hidden="true"></div>

      <section id="resultPanel" class="modal-panel is-hidden" aria-live="polite">
        <div class="modal-card result-card">
          <img src="../../assets/weightplay-character-boom-mane-lion-cutout.webp" alt="Boom Mane Leo" />
          <div>
            <h2 id="resultTitle">Victory</h2>
            <p id="resultText"></p>
            <p id="resultStars" class="result-stars"></p>
            <p id="resultRewardText" class="result-reward"></p>
            <p id="skillReportText" class="skill-report"></p>
            <div class="result-actions">
              <button id="nextStageBtn" class="primary-btn" type="button">Next Stage</button>
              <button id="rerollRewardBtn" class="secondary-btn" type="button">Reroll Reward</button>
              <button id="retryBtn" class="secondary-btn" type="button">Retry</button>
              <button id="resultMenuBtn" class="secondary-btn" type="button">Menu</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="../../src/site-config.js?v=20260710-guardian-clean-cutouts1"></script>
    <script src="../../src/analytics.js?v=20260701-analytics2"></script>
    <script src="../../src/wallet.js?v=20260706-crystal-diamond-charm1"></script>
    <script src="../../src/i18n.js?v=20260710-mobile-play-shell2"></script>
    <script src="../../src/edge-guard.js?v=20260710-mobile-play-shell2"></script>
    <script src="../../src/tutorial.js?v=20260701-style1"></script>
    <script src="game.js?v=20260710-guardian-clean-cutouts1"></script>
    <script src="../../src/game-page-info.js?v=20260710-guardian-public1"></script>
  </body>
</html>
