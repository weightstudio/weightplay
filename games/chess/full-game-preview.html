<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Chess · Work in progress</title><link rel="stylesheet" href="full-game.css"></head><body>
<header><a id="exit" href="/" aria-label="WeightPlay"><img src="../../assets/weightplay-logo.png" alt="WeightPlay"></a><h1 id="title"></h1><select id="locale" aria-label="Language"></select></header>
<main id="main"><img class="poster" src="../../assets/chess-cover-v1.webp" width="1254" height="1254" alt=""><p id="intro"></p><button id="start"></button><button id="resume" hidden></button><details><summary id="guideTitle"></summary><p id="guide"></p></details></main>
<section id="stages" hidden><h2 id="stageTitle"></h2><div id="stageList"></div><button id="stageBack"></button></section>
<section id="battle" hidden><nav><button id="back"></button><span id="status" role="status" aria-live="polite"></span></nav><div id="arena" role="application" tabindex="0" aria-label="Chess board"><span id="keyboard" class="sr" aria-live="polite"></span></div><div id="controls"><button id="undo"></button><button id="hint"></button><button id="restart"></button></div><p id="saved"></p><div class="reserve" aria-hidden="true"></div></section>
<section id="result" hidden><h2 id="outcome"></h2><button id="again"></button><button id="resultBack"></button></section>
<dialog id="promotion"><h2 id="promoteTitle"></h2><div id="promoteChoices"></div></dialog>
<dialog id="confirmation"><p id="confirmText"></p><button id="confirmYes"></button><button id="confirmNo"></button></dialog>
<dialog id="error"><p id="errorText"></p><button id="errorRetry"></button><button id="errorBack"></button></dialog>
<script type="module" src="full-game.mjs"></script></body></html>
