<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="weightplay-scene-controls" content="immutable"><title>Chess · Work in progress</title><link rel="stylesheet" href="../../src/game-shell-controls-standard.css"><link rel="stylesheet" href="full-game.css"><link rel="stylesheet" href="../../src/game-shell-header-layout.css"></head><body data-screen="main" data-wp-game-id="chess" data-wp-battle-layout="native" data-wp-game-owned-guide data-sound-toggle="off">
<div id="mainScene" data-screen="main" class="wp-standard-main-screen">
<header class="wp-shell-header-layout"><a id="exit" href="/" data-wp-return="main" aria-label="WeightPlay"><span aria-hidden="true">←</span><img src="../../assets/weightplay-logo.png" alt="" draggable="false"></a><h1 id="title"></h1><select id="locale" aria-label="Language"></select></header>
<main id="main"><img class="poster" src="../../assets/chess-cover-v1.webp" width="1254" height="1254" alt=""><p id="intro"></p><p id="campaignProgress" data-wp-main-progress></p><button id="challenges" data-wp-main-start></button></main>
<article id="rulesReference" aria-labelledby="guideTitle"><h2 id="guideTitle"></h2><div id="guide"></div></article>
</div>
<section id="stages" data-screen="stage" hidden><header class="wp-shell-header-layout"><button id="stageBack" data-wp-return="stage"><span aria-hidden="true">←</span></button><h2 id="stageTitle"></h2></header><div id="stageList"></div><div id="matchModes"><button id="start"></button><button id="resume" hidden></button></div><div id="stageReserve" aria-hidden="true"></div></section>
<section id="battle" hidden><nav class="topbar"><button id="back"></button><span id="status" role="status" aria-live="polite"></span></nav><div id="arena" role="application" tabindex="0" aria-label="Chess board"><span id="keyboard" class="sr" aria-live="polite"></span></div><div id="controls"><button id="undo"></button><button id="hint"></button><button id="restart"></button></div><p id="saved"></p>
<section id="result" data-wp-result-screen aria-labelledby="outcome" hidden>
 <div class="result-content"><div class="result-heading"><h2 id="outcome" tabindex="-1"></h2><p id="resultReason"></p></div>
 <img id="resultBoard" alt="" hidden><dl id="resultStats"></dl></div>
 <div class="result-actions"><button id="resultBack"></button><button id="nextChallenge" disabled></button><button id="again"></button></div>
</section><dialog id="confirmation" aria-describedby="confirmText"><p id="confirmText"></p><button id="confirmNo" autofocus></button><button id="confirmYes"></button></dialog><div class="reserve" aria-hidden="true"></div></section>
<dialog id="promotion"><h2 id="promoteTitle"></h2><div id="promoteChoices"></div></dialog>
<dialog id="error"><p id="errorText"></p><button id="errorRetry"></button><button id="errorBack"></button></dialog>
<script src="../../src/sound.js"></script><script src="../../src/game-shell-controls-standard.js"></script><script type="module" src="full-game.mjs"></script></body></html>
