<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Signal Scout</title><desc id="desc">A twilight lookout with three coloured animal signal lights.</desc>
