  <rect width="900" height="700" fill="url(#sky)"/><circle cx="710" cy="145" r="76" fill="#e9f3ff" opacity=".9"/><circle cx="710" cy="145" r="116" fill="url(#glow)" opacity=".38"/>
  <path d="M0 520Q170 420 330 505T650 470T900 510V700H0Z" fill="#0b3141"/><path d="M0 595Q180 505 360 590T700 560T900 590V700H0Z" fill="#082b39"/>
  <path d="M205 505h370l-38 150H245z" fill="#153c59" stroke="#76e6c4" stroke-width="7"/><path d="M260 505l130-170 130 170" fill="#1c5270" stroke="#76e6c4" stroke-width="7"/><path d="M390 335v-95" stroke="#ffd166" stroke-width="12"/><circle cx="390" cy="220" r="34" fill="#ffd166"/><circle cx="390" cy="220" r="70" fill="url(#glow)" opacity=".55"/>
