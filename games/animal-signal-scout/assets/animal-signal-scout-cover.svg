  <g><circle cx="220" cy="185" r="23" fill="#ffd166"/><circle cx="142" cy="265" r="23" fill="#76e6c4"/><circle cx="625" cy="280" r="23" fill="#b78cff"/><path d="M220 185l80 80M142 265l70 70M625 280l-75 70" stroke="#f4f7ff" stroke-width="4" opacity=".55"/></g>
  <text x="55" y="90" fill="#f4f7ff" font-family="system-ui,sans-serif" font-size="42" font-weight="800">SIGNAL SCOUT</text>
  <text x="58" y="132" fill="#b8c7df" font-family="system-ui,sans-serif" font-size="22">Decode the note · light the lookout</text>
