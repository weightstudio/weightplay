<!doctype html>
<html lang="en">
<head>
  <script src="../../src/game-layout-config.js?v=20260919-banner1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="weightplay-audience" content="general">
  <meta name="weightplay-scene-controls" content="immutable">
  <title>Bramble Rapids | WeightPlay</title>
  <link rel="stylesheet" href="../../src/stage-selector-standard.css" data-wp-stage-standard>
  <link rel="stylesheet" href="../../src/battle-canvas-standard.css" data-wp-battle-standard>
  <link rel="stylesheet" href="../../src/game-page-info.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../src/game-screen-frame.css?v=20260921-interface7-single-frame-v2">
</head>
<body data-screen="main" data-game-id="bramble-rapids" data-wp-game-id="bramble-rapids" data-has-stage="true">
  <div id="gameFrame" data-wp-frame-root>
  <div id="mainGroup">
    <main id="mainScreen" class="main-screen">
      <header class="main-header" data-wp-shell-header="main">
        <a id="mainReturn" href="/" data-wp-return="main" aria-label="Back to WeightPlay"><span aria-hidden="true">←</span><img src="../../assets/weightplay-logo.png" alt=""></a>
        <strong data-wp-game-title>Bramble Rapids</strong>
      </header>
      <section class="main-hero">
        <img class="main-poster cover" src="../../assets/bramble-rapids/cover.webp" alt="Bramble Rapids poster">
        <div class="main-copy menu-copy">
          <small>WeightPlay Original</small>
          <h1>Bramble Rapids</h1>
          <p class="main-summary">Replace this with one concise, truthful summary of the shipped core loop.</p>
          <div class="main-progress" data-wp-main-progress>Stage 1</div>
          <button id="startBtn" type="button" data-wp-main-start>Start Game</button>
        </div>
      </section>
    </main>
    <section id="gameGuide" class="game-page-info game-page-info-static" data-wp-game-guide aria-label="Game guide">
      <div id="gameGuideTitle" class="game-info-hero" data-wp-content-slot="guide-title"></div>
      <div id="gameGuideFacts" class="game-info-facts" data-wp-content-slot="guide-facts"></div>
      <div id="gameGuideSections" class="game-info-sections" data-wp-content-slot="guide-sections"></div>
      <div id="gameGuideFaq" data-wp-content-slot="guide-faq"></div>
      <div id="gameGuideRelated" data-wp-content-slot="guide-related"></div>
    </section>
  </div>

  
  <section id="stageScreen" class="stage-screen" hidden>
    <div class="stage-canvas wp-stage-art-shell" data-wp-standard-stage-screen data-wp-canvas-max-width="920" style="--wp-stage-art:url('../../assets/bramble-rapids/cover.webp')">
      <header class="stage-header" data-wp-shell-header="stage"><button id="stageBackBtn" type="button" data-wp-return="stage" aria-label="Back to Main">←</button><strong>Bramble Rapids</strong><span aria-hidden="true"></span></header>
      <section id="stageWorkspace" class="stage-workspace">
        <div id="stageRail" class="stage-rail" role="tabpanel" aria-labelledby="stagesTab" data-wp-stage-rail>
          <button class="stage-card" type="button" data-wp-stage-card aria-current="true"><strong>Stage 1</strong><span>Replace with a real objective</span></button>
        </div>
      </section>
      <nav class="stage-tabs" aria-label="Stage preparation" role="tablist">
        <span aria-hidden="true"></span><button id="stagesTab" type="button" role="tab" aria-controls="stageRail" aria-selected="true">Stages</button><span aria-hidden="true"></span>
      </nav>
    </div>
    <div class="stage-ad-reserve" data-wp-ad-reserve aria-hidden="true"></div>
  </section>
  

  <section id="battleScreen" class="battle-screen" hidden>
    <div class="battle-canvas" data-wp-logical-battle-canvas data-wp-battle-canvas-root data-wp-canvas-max-width="920" data-wp-battle-min-width="390" data-wp-battle-min-height="788" data-wp-battle-landscape-width="760" data-wp-battle-landscape-height="334">
      <header class="battle-header" data-wp-shell-header="battle"><button id="battleBackBtn" type="button" data-wp-return="battle" aria-label="Back">←</button><strong>Bramble Rapids</strong><button id="pauseBtn" type="button" data-wp-battle-utility aria-label="Pause">Ⅱ</button></header>
      <main class="battle-workspace" data-wp-shell-content="battle">
        <section class="game-owned-play-surface" aria-label="Game play surface"><p>Replace this bounded area with the game-owned simulation.</p><button id="gameActionBtn" type="button" data-wp-primary-action>Game action</button></section>
        <p id="battleFeedback" aria-live="polite">Ready.</p>
      </main>
    </div>
    <div class="battle-ad-reserve" data-wp-ad-reserve aria-hidden="true"></div>
  </section>
  </div>

  <script src="../../src/stage-selector-standard.js" data-wp-stage-standard></script>
  <script src="../../src/battle-canvas-standard.js" data-wp-battle-standard></script>
  <script src="../../src/game-screen-frame.js?v=20260921-interface7-single-frame-v2"></script>
  <script src="game.js"></script>
</body>
</html>
