  <g transform="translate(116 196) rotate(-13 115 160)"><rect width="230" height="320" rx="20" fill="#fffdf8" stroke="#17324b" stroke-width="8"/><text x="24" y="58" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#c83d4b">Q</text><text x="23" y="104" font-size="45" fill="#c83d4b">♥</text><text x="115" y="205" text-anchor="middle" font-size="94" fill="#c83d4b">♥</text></g>
