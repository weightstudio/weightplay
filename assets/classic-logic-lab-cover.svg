    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#76d7ff"/><stop offset="1" stop-color="#b395ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020817" flood-opacity=".55"/></filter>
  </defs>
  <rect width="900" height="900" rx="80" fill="url(#bg)"/>
  <circle cx="130" cy="110" r="150" fill="#5dc9ff" opacity=".13"/><circle cx="780" cy="740" r="220" fill="#a98bff" opacity=".12"/>
