  <g fill="#f7fbff" font-family="system-ui,sans-serif" text-anchor="middle"><text x="450" y="704" font-size="58" font-weight="900" letter-spacing="5">LOGIC LAB</text><text x="450" y="756" font-size="25" fill="#abd0ee" letter-spacing="4">TEN CLASSIC CHALLENGES</text></g>
