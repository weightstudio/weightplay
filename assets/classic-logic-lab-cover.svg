    <g fill="url(#glow)"><rect x="225" y="236" width="82" height="82" rx="18"/><rect x="327" y="236" width="82" height="82" rx="18" opacity=".72"/><rect x="429" y="236" width="82" height="82" rx="18" opacity=".9"/><rect x="531" y="236" width="82" height="82" rx="18" opacity=".6"/><rect x="633" y="236" width="36" height="82" rx="16" opacity=".42"/></g>
