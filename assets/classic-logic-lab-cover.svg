<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Classic Logic Lab</title>
  <desc id="desc">A luminous constellation of logic boards, numbers, switches and tokens.</desc>
  <defs>
